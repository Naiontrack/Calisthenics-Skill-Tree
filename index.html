        }

        function renderChatInputState() {
            const box = document.getElementById('chat-input-box');
            if (!box) return;

            if (!currentUser) {
                box.innerHTML = `<p style="color: var(--subtext); font-size: 0.85rem; text-align:center; margin:0; padding:8px; width:100%;">🔒 Accedi per scrivere in chat.</p>`;
                return;
            }

            if (activeChatView === 'private-list') {
                box.innerHTML = `
                    <div class="chat-input-row">
                        <button class="chat-new-btn" onclick="openNewChatModal()">✉️ Nuova chat privata o gruppo</button>
                    </div>
                `;
                return;
            }

            box.innerHTML = `
                <div class="chat-input-row">
                    <input type="text" id="chat-input" placeholder="Scrivi un messaggio..." maxlength="300">
                    <button onclick="sendChatMessage()">Invia</button>
                </div>
            `;
            const input = document.getElementById('chat-input');
            input.onkeypress = (e) => {
                if (e.key === 'Enter') sendChatMessage();
            };
        }

        // ==========================================
        // FORMATTAZIONE DATA/ORA MESSAGGI
        // ==========================================
        function timestampToDate(ts) {
            if (!ts) return null; // serverTimestamp non ancora confermato dal server
            if (typeof ts.toDate === 'function') return ts.toDate();
            return null;
        }

        function formatChatTime(ts) {
            const date = timestampToDate(ts);
            if (!date) return '';
            return date.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
        }

        function formatDayLabel(date) {
            const today = new Date();
            const yesterday = new Date();
            yesterday.setDate(today.getDate() - 1);

            const isSameDay = (a, b) => a.getFullYear() === b.getFullYear()
                && a.getMonth() === b.getMonth()
                && a.getDate() === b.getDate();

            if (isSameDay(date, today)) return 'Oggi';
            if (isSameDay(date, yesterday)) return 'Ieri';
            return date.toLocaleDateString('it-IT', { day: '2-digit', month: 'long', year: 'numeric' });
        }

        // ==========================================
        // RENDERING CONDIVISO DEI MESSAGGI
        // ==========================================
        function renderMessagesIntoContainer(msgs, container) {
            if (msgs.length === 0) {
                container.innerHTML = `<p style="color: var(--subtext); text-align:center; font-size:0.85rem;">Nessun messaggio ancora. Scrivi il primo! 👋</p>`;
                return;
            }

            let html = '';
            let lastDayKey = null;

            msgs.forEach(m => {
                const isMe = currentUser && m.uid === currentUser.uid;
                const msgDate = timestampToDate(m.createdAt);

                if (msgDate) {
                    const dayKey = msgDate.getFullYear() + '-' + msgDate.getMonth() + '-' + msgDate.getDate();
                    if (dayKey !== lastDayKey) {
                        html += `<div class="chat-day-divider"><span>${formatDayLabel(msgDate)}</span></div>`;
                        lastDayKey = dayKey;
                    }
                }

                const textHtml = m.text ? `<span class="chat-msg-text">${escapeHtml(m.text)}</span>` : '';
                const sentTime = formatChatTime(m.createdAt);
                const editedTime = m.edited ? formatChatTime(m.editedAt) : '';
                const editedHtml = m.edited
                    ? `<span class="chat-msg-edited"> (modificato${editedTime ? ' alle ' + editedTime : ''})</span>`
                    : '';
                const timeHtml = sentTime ? `<span class="chat-msg-time">${sentTime}</span>` : '';

                const actionsHtml = isMe ? `
                    <div class="chat-msg-actions">
                        <button class="chat-msg-action-btn" title="Modifica" onclick="openEditMessageModal('${m.id}')">✏️</button>
                        <button class="chat-msg-action-btn" title="Elimina" onclick="askDeleteChatMessage('${m.id}')">🗑️</button>
                    </div>
                ` : '';

                html += `
                    <div class="chat-message ${isMe ? 'chat-message-mine' : ''}">
                        <span class="chat-msg-author">${escapeHtml(m.nickname || 'Anonimo')}</span>
                        ${textHtml}${editedHtml}
                        <div class="chat-msg-footer">
                            ${timeHtml}
                            ${actionsHtml}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        // Restituisce il riferimento Firestore alla collezione di messaggi attualmente visualizzata
        function currentMessagesRef() {
            if (activeChatView === 'private-thread' && activeConversationId) {
                return db.collection("conversations").doc(activeConversationId).collection("messages");
            }
            return db.collection("chatMessages");
        }

        function initChatListener() {
            if (chatUnsubscribe) return; // già in ascolto

            const container = document.getElementById('chat-messages');
            chatUnsubscribe = db.collection("chatMessages")
                .orderBy("createdAt", "desc")
                .limit(50)
                .onSnapshot((snapshot) => {
                    let msgs = [];
                    chatMessagesCache = {};
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        chatMessagesCache[doc.id] = data;
                        msgs.push(Object.assign({ id: doc.id }, data));
                    });
                    msgs.reverse();
                    renderMessagesIntoContainer(msgs, container);
                }, (error) => {
                    console.error("Errore nel caricamento della chat:", error);
                    container.innerHTML = `<p style="color: var(--subtext); text-align:center; font-size:0.85rem;">Errore nel caricamento della chat.</p>`;
                });
        }

        function sendChatMessage() {
            if (!currentUser) return;
            const input = document.getElementById('chat-input');
            if (!input) return;
            const text = input.value.trim();
            if (!text) return;

            const isPrivateThread = activeChatView === 'private-thread' && activeConversationId;
            const messagesRef = currentMessagesRef();
            const msgText = text.slice(0, 300);

            input.disabled = true;
            messagesRef.add({
                uid: currentUser.uid,
                nickname: userNickname || (currentUser.email ? currentUser.email.split('@')[0] : 'Anonimo'),
                text: msgText,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                input.value = '';
                input.disabled = false;
                input.focus();
                if (isPrivateThread) {
                    db.collection("conversations").doc(activeConversationId).update({
                        lastMessageText: msgText,
                        lastMessageAt: firebase.firestore.FieldValue.serverTimestamp()
                    }).catch((error) => console.error("Errore aggiornamento anteprima chat:", error));
                }
            }).catch((error) => {
                console.error("Errore invio messaggio:", error);
                input.disabled = false;
            });
        }

        // ==========================================
        // CHAT PRIVATE E GRUPPI
        // ==========================================
        function conversationDisplayName(conv) {
            if (!conv) return '...';
            if (conv.type === 'group') return conv.name || 'Gruppo senza nome';
            const otherUid = (conv.participants || []).find(uid => uid !== currentUser.uid);
            return (conv.participantNames && conv.participantNames[otherUid]) || 'Utente';
        }

        function initConversationsListener() {
            if (conversationsUnsubscribe || !currentUser) return;

            const container = document.getElementById('chat-messages');
            conversationsUnsubscribe = db.collection("conversations")
                .where("participants", "array-contains", currentUser.uid)
                .orderBy("lastMessageAt", "desc")
                .onSnapshot((snapshot) => {
                    let convs = [];
                    snapshot.forEach(doc => convs.push(Object.assign({ id: doc.id }, doc.data())));

                    if (convs.length === 0) {
                        container.innerHTML = `<p style="color: var(--subtext); text-align:center; font-size:0.85rem;">Nessuna chat privata. Tocca "Nuova chat" per iniziare! 👋</p>`;
                        return;
                    }

                    let html = '';
                    convs.forEach(c => {
                        const title = conversationDisplayName(c);
                        const preview = c.lastMessageText ? escapeHtml(c.lastMessageText).slice(0, 40) : 'Nessun messaggio ancora';
                        const icon = c.type === 'group' ? '👥' : '👤';
                        html += `
                            <div class="chat-list-item" onclick="openConversation('${c.id}')">
                                <span class="chat-list-icon">${icon}</span>
                                <div class="chat-list-info">
                                    <span class="chat-list-name">${escapeHtml(title)}</span>
                                    <span class="chat-list-preview">${preview}</span>
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                }, (error) => {
                    console.error("Errore nel caricamento delle chat private:", error);
                    container.innerHTML = `<p style="color: var(--subtext); text-align:center; font-size:0.85rem;">Errore nel caricamento delle chat.</p>`;
                });
        }

        function stopConversationsListener() {
            if (conversationsUnsubscribe) {
                conversationsUnsubscribe();
                conversationsUnsubscribe = null;
            }
        }

        function initConversationMessagesListener(convId) {
            stopConversationMessagesListener();
            const container = document.getElementById('chat-messages');

            conversationMessagesUnsubscribe = db.collection("conversations").doc(convId).collection("messages")
                .orderBy("createdAt", "desc")
                .limit(50)
                .onSnapshot((snapshot) => {
                    let msgs = [];
                    chatMessagesCache = {};
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        chatMessagesCache[doc.id] = data;
                        msgs.push(Object.assign({ id: doc.id }, data));
                    });
                    msgs.reverse();
                    renderMessagesIntoContainer(msgs, container);
                }, (error) => {
                    console.error("Errore nel caricamento dei messaggi:", error);
                    container.innerHTML = `<p style="color: var(--subtext); text-align:center; font-size:0.85rem;">Errore nel caricamento dei messaggi.</p>`;
                });
        }

        function stopConversationMessagesListener() {
            if (conversationMessagesUnsubscribe) {
                conversationMessagesUnsubscribe();
                conversationMessagesUnsubscribe = null;
            }
        }

        function openConversation(convId) {
            if (!currentUser) return;

            activeChatView = 'private-thread';
            activeConversationId = convId;
            activeConversationData = null;

            document.getElementById('chat-thread-header').style.display = 'flex';
            document.getElementById('chat-thread-title').innerText = '...';
            document.getElementById('chat-messages').innerHTML = `<p style="color: var(--subtext); text-align:center; font-size:0.85rem;">Caricamento...</p>`;

            db.collection("conversations").doc(convId).get().then((doc) => {
                if (!doc.exists) return;
                activeConversationData = Object.assign({ id: doc.id }, doc.data());
                document.getElementById('chat-thread-title').innerText = conversationDisplayName(activeConversationData);
            }).catch((error) => console.error("Errore nel recupero della conversazione:", error));

            stopConversationsListener();
            renderChatInputState();
            initConversationMessagesListener(convId);
        }

        function backToPrivateList() {
            stopConversationMessagesListener();
            activeChatView = 'private-list';
            activeConversationId = null;
            activeConversationData = null;
            document.getElementById('chat-thread-header').style.display = 'none';
            renderChatInputState();
            initConversationsListener();
        }

        // ==========================================
        // NUOVA CHAT PRIVATA / NUOVO GRUPPO
        // ==========================================
        function openNewChatModal() {
            if (!currentUser) return;
            newChatSelectedUsers = {};
            newChatMode = 'dm';

            const modal = document.getElementById('custom-modal');
            const titleEl = document.getElementById('modal-title');
            const bodyContent = document.getElementById('modal-body-content');
            const actionsBox = document.getElementById('modal-actions-box');

            titleEl.innerText = "✉️ Nuova chat";
            bodyContent.innerHTML = `
                <div class="auth-error" id="new-chat-error"></div>
                <div class="chat-mode-toggle">
                    <button type="button" id="new-chat-mode-dm" class="active" onclick="setNewChatMode('dm')">👤 Messaggio privato</button>
                    <button type="button" id="new-chat-mode-group" onclick="setNewChatMode('group')">👥 Crea gruppo</button>
                </div>
                <div class="auth-form-group" id="new-chat-group-name-wrap" style="display:none;">
                    <label>Nome del gruppo</label>
                    <input type="text" id="new-chat-group-name" placeholder="es. Squadra Mattina" maxlength="40">
                </div>
                <div class="auth-form-group">
                    <label id="new-chat-picker-label">Scegli un utente</label>
                    <input type="text" id="new-chat-search" placeholder="Cerca per nickname...">
                    <div class="user-picker-list" id="new-chat-user-list">
                        <p style="text-align:center; color:var(--subtext); font-size:0.8rem; padding:10px;">Caricamento utenti...</p>
                    </div>
                </div>
            `;
            actionsBox.innerHTML = `
                <button class="btn-cancel" id="modal-btn-cancel">Annulla</button>
                <button class="btn-confirm" id="new-chat-confirm-btn">Avvia chat</button>
            `;

            modal.classList.add('active');
            document.getElementById('modal-btn-cancel').onclick = () => modal.classList.remove('active');
            document.getElementById('new-chat-search').oninput = (e) => renderUserPickerList(e.target.value);
            document.getElementById('new-chat-confirm-btn').onclick = confirmNewChat;

            loadUsersForPicker();
        }

        let newChatAllUsers = [];

        function loadUsersForPicker() {
            db.collection("users").get().then((snapshot) => {
                newChatAllUsers = [];
                snapshot.forEach(doc => {
                    if (doc.id === currentUser.uid) return; // escludi se stesso
                    const data = doc.data();
                    if (data.nickname) {
                        newChatAllUsers.push({ uid: doc.id, nickname: data.nickname });
                    }
                });
                newChatAllUsers.sort((a, b) => a.nickname.localeCompare(b.nickname));
                renderUserPickerList('');
            }).catch((error) => {
                console.error("Errore nel caricamento degli utenti:", error);
                const listEl = document.getElementById('new-chat-user-list');
                if (listEl) listEl.innerHTML = `<p style="text-align:center; color:var(--subtext); font-size:0.8rem; padding:10px;">Errore nel caricamento utenti.</p>`;
            });
        }

        function renderUserPickerList(filterText) {
            const listEl = document.getElementById('new-chat-user-list');
            if (!listEl) return;

            const filter = (filterText || '').trim().toLowerCase();
            const filtered = newChatAllUsers.filter(u => u.nickname.toLowerCase().includes(filter));

            if (filtered.length === 0) {
                listEl.innerHTML = `<p style="text-align:center; color:var(--subtext); font-size:0.8rem; padding:10px;">Nessun utente trovato.</p>`;
                return;
            }

            listEl.innerHTML = filtered.map(u => {
                const isSelected = !!newChatSelectedUsers[u.uid];
                return `
                    <div class="user-picker-item ${isSelected ? 'selected' : ''}" onclick="toggleUserPick('${u.uid}', '${escapeHtml(u.nickname)}')">
                        ${newChatMode === 'group' ? `<input type="checkbox" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation(); toggleUserPick('${u.uid}', '${escapeHtml(u.nickname)}')">` : ''}
                        <span>${escapeHtml(u.nickname)}</span>
                    </div>
                `;
            }).join('');
        }

        function setNewChatMode(mode) {
            newChatMode = mode;
            newChatSelectedUsers = {};

            document.getElementById('new-chat-mode-dm').classList.toggle('active', mode === 'dm');
            document.getElementById('new-chat-mode-group').classList.toggle('active', mode === 'group');
            document.getElementById('new-chat-group-name-wrap').style.display = mode === 'group' ? 'block' : 'none';
            document.getElementById('new-chat-picker-label').innerText = mode === 'group' ? 'Scegli i membri del gruppo' : 'Scegli un utente';
            document.getElementById('new-chat-confirm-btn').innerText = mode === 'group' ? 'Crea gruppo' : 'Avvia chat';

            renderUserPickerList(document.getElementById('new-chat-search').value);
        }

        function toggleUserPick(uid, nickname) {
            if (newChatMode === 'dm') {
                newChatSelectedUsers = { [uid]: nickname };
            } else {
                if (newChatSelectedUsers[uid]) {
                    delete newChatSelectedUsers[uid];
                } else {
                    newChatSelectedUsers[uid] = nickname;
                }
            }
            renderUserPickerList(document.getElementById('new-chat-search').value);
        }

        function confirmNewChat() {
            const errEl = document.getElementById('new-chat-error');
            const selectedUids = Object.keys(newChatSelectedUsers);

            if (newChatMode === 'dm') {
                if (selectedUids.length !== 1) {
                    errEl.innerText = "Scegli un utente con cui iniziare una chat privata.";
                    return;
                }
                const otherUid = selectedUids[0];
                findOrCreateDM(otherUid, newChatSelectedUsers[otherUid]);
            } else {
                const groupName = document.getElementById('new-chat-group-name').value.trim();
                if (!groupName) {
                    errEl.innerText = "Inserisci un nome per il gruppo.";
                    return;
                }
                if (selectedUids.length === 0) {
                    errEl.innerText = "Scegli almeno un membro da invitare nel gruppo.";
                    return;
                }
                createGroup(groupName, newChatSelectedUsers);
            }
        }

        function findOrCreateDM(otherUid, otherNickname) {
            const errEl = document.getElementById('new-chat-error');
            const convId = [currentUser.uid, otherUid].sort().join('_');
            const convRef = db.collection("conversations").doc(convId);

            convRef.get().then((doc) => {
                if (doc.exists) {
                    return Promise.resolve();
                }
                return convRef.set({
                    type: 'dm',
                    participants: [currentUser.uid, otherUid],
                    participantNames: {
                        [currentUser.uid]: userNickname || 'Anonimo',
                        [otherUid]: otherNickname
                    },
                    createdBy: currentUser.uid,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    lastMessageText: '',
                    lastMessageAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            }).then(() => {
                document.getElementById('custom-modal').classList.remove('active');
                activeChatView = 'private-list';
                openConversation(convId);
            }).catch((error) => {
                console.error("Errore nella creazione della chat privata:", error);
                if (errEl) errEl.innerText = "Errore durante la creazione della chat.";
            });
        }

        function createGroup(groupName, selectedUsers) {
            const errEl = document.getElementById('new-chat-error');
            const participantNames = Object.assign({}, selectedUsers);
            participantNames[currentUser.uid] = userNickname || 'Anonimo';
            const participants = Object.keys(participantNames);

            db.collection("conversations").add({
                type: 'group',
                name: groupName.slice(0, 40),
                participants: participants,
                participantNames: participantNames,
                createdBy: currentUser.uid,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                lastMessageText: '',
                lastMessageAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then((docRef) => {
                document.getElementById('custom-modal').classList.remove('active');
                activeChatView = 'private-list';
                openConversation(docRef.id);
            }).catch((error) => {
                console.error("Errore nella creazione del gruppo:", error);
                if (errEl) errEl.innerText = "Errore durante la creazione del gruppo.";
            });
        }

        // ==========================================
        // MODIFICA MESSAGGIO
        // ==========================================
        function openEditMessageModal(msgId) {
            const data = chatMessagesCache[msgId];
            if (!data) return;

            const modal = document.getElementById('custom-modal');
            const titleEl = document.getElementById('modal-title');
            const bodyContent = document.getElementById('modal-body-content');
            const actionsBox = document.getElementById('modal-actions-box');

            titleEl.innerText = "✏️ Modifica Messaggio";
            bodyContent.innerHTML = `
                <div class="auth-error" id="edit-msg-error"></div>
                <div class="auth-form-group">
                    <label>Testo del messaggio</label>
                    <textarea id="edit-msg-textarea" maxlength="300" rows="3" style="width:100%; box-sizing:border-box; padding:10px; border-radius:6px; border:1px solid var(--locked); background:var(--input-bg); color:var(--text); font-family:inherit; resize:vertical;">${escapeHtml(data.text || '')}</textarea>
                </div>
            `;
            actionsBox.innerHTML = `
                <button class="btn-cancel" id="modal-btn-cancel">Annulla</button>
                <button class="btn-confirm" id="save-edit-msg-btn">Salva</button>
            `;

            modal.classList.add('active');
            document.getElementById('modal-btn-cancel').onclick = () => modal.classList.remove('active');

            document.getElementById('save-edit-msg-btn').onclick = () => {
                const newText = document.getElementById('edit-msg-textarea').value.trim();
                const errEl = document.getElementById('edit-msg-error');

                if (!newText) {
                    errEl.innerText = "Il messaggio non può essere vuoto.";
                    return;
                }

                currentMessagesRef().doc(msgId).update({
                    text: newText.slice(0, 300),
                    edited: true,
                    editedAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    modal.classList.remove('active');
                }).catch((error) => {
                    console.error("Errore modifica messaggio:", error);
                    errEl.innerText = "Errore durante il salvataggio della modifica.";
                });
            };
        }

        // ==========================================
        // ELIMINAZIONE MESSAGGIO
        // ==========================================
        function askDeleteChatMessage(msgId) {
            openCustomModal(
                "🗑️ Elimina Messaggio",
                "Sei sicuro di voler eliminare questo messaggio? L'azione è irreversibile.",
                "Elimina",
                true,
                () => {
                    currentMessagesRef().doc(msgId).delete().catch((error) => {
                        console.error("Errore eliminazione messaggio:", error);
                    });
                }
            );
        }


        initCategorySelect();
        applyTheme(currentTheme);
        renderProfileSettings();
    </script>
</body>
</html>
