<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Occhionero's Calisthenics Tree</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            /* TEMA PREDEFINITO (Futuristic Dark) */
            --bg-color: #0b0f19;
            --card-bg: #151d30;
            --accent: #38bdf8;
            --locked: #334155;
            --unlocked: #22c55e;
            --text: #f8fafc;
            --subtext: #94a3b8;
            --line-color: #1e293b;
            --danger: #ef4444;
            --input-bg: #0b0f19;
            --img-bg: #070a12;
            --border-glow: rgba(56, 189, 248, 0.4);
        }

        /* TEMA CHIARO */
        body.theme-light {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --accent: #0284c7;
            --locked: #cbd5e1;
            --unlocked: #16a34a;
            --text: #0f172a;
            --subtext: #64748b;
            --line-color: #cbd5e1;
            --danger: #dc2626;
            --input-bg: #f8fafc;
            --img-bg: #e2e8f0;
            --border-glow: rgba(2, 132, 199, 0.25);
        }

        /* TEMA SCURO CLASSICO */
        body.theme-dark {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #bb86fc;
            --locked: #374151;
            --unlocked: #03dac6;
            --text: #e0e0e0;
            --subtext: #9ca3af;
            --line-color: #2d2d2d;
            --danger: #cf6679;
            --input-bg: #121212;
            --img-bg: #2a2a2a;
            --border-glow: rgba(187, 134, 252, 0.3);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 900px;
            position: static;
            background: var(--bg-color);
            padding-top: 10px;
            padding-bottom: 15px;
            z-index: 10;
            transition: background-color 0.3s ease;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h1 {
            margin: 0;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.4rem;
            text-shadow: 0 0 15px var(--border-glow);
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .selector-box {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .custom-select {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--accent);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            max-width: 200px;
        }

        /* AUTH BAR STYLES */
        .auth-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 8px 15px;
            border-radius: 10px;
            border: 1px solid var(--line-color);
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .auth-bar span {
            color: var(--subtext);
        }

        .auth-bar strong {
            color: var(--accent);
        }

        .auth-actions {
            display: flex;
            gap: 8px;
        }

        .btn-auth {
            background: var(--accent);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .btn-auth-secondary {
            background: var(--locked);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        /* SOCIAL LOGIN BUTTONS */
        .social-auth-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid var(--line-color);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-google {
            background-color: #ffffff;
            color: #000000;
        }
        .btn-google:hover {
            background-color: #f1f5f9;
        }

        .btn-apple {
            background-color: #000000;
            color: #ffffff;
        }
        .btn-apple:hover {
            background-color: #1e293b;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 15px 0;
            color: var(--subtext);
            font-size: 0.8rem;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--line-color);
        }

        .auth-divider:not(:empty)::before {
            margin-right: .5em;
        }

        .auth-divider:not(:empty)::after {
            margin-left: .5em;
        }

        .rank-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 16px;
            border: 2px solid var(--accent);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            transition: background-color 0.3s ease, border-color 0.3s ease;
            margin-bottom: 15px;
        }

        .rank-badge-box {
            width: 90px;
            height: 90px;
            margin-bottom: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 12px var(--border-glow));
        }

        .rank-badge-box svg {
            width: 100%;
            height: 100%;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: var(--locked);
            border-radius: 6px;
            overflow: hidden;
            margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--unlocked));
            transition: width 0.4s ease;
        }

        /* CLASSIFICA GLOBALE (LEADERBOARD) - POSIZIONATA IN HEADER */
        .leaderboard-section {
            width: 100%;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            box-sizing: border-box;
            border: 1px solid var(--line-color);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            text-align: left;
        }

        .leaderboard-title {
            color: var(--accent);
            font-size: 1.1rem;
            margin: 0 0 12px 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 6px;
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-color);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--line-color);
            cursor: pointer;
            transition: border-color 0.2s ease, transform 0.1s ease;
        }

        .leaderboard-item:hover {
            border-color: var(--accent);
        }

        .leaderboard-item:active {
            transform: scale(0.98);
        }

        .leaderboard-item.current-user-item {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--border-glow);
        }

        .leaderboard-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .leaderboard-rank-pos {
            font-weight: bold;
            font-size: 0.9rem;
            min-width: 22px;
            color: var(--subtext);
        }

        .leaderboard-avatar {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .leaderboard-avatar svg {
            width: 100%;
            height: 100%;
        }

        .leaderboard-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .leaderboard-xp {
            font-weight: bold;
            color: var(--unlocked);
            font-size: 0.85rem;
        }

        .tree-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 40px;
        }

        .category-title {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 6px;
            margin-top: 10px;
            text-transform: uppercase;
            font-size: 1.1rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .skill-tree-branch {
            display: flex;
            flex-direction: column;
            position: relative;
            padding-left: 12px;
            border-left: 2px dashed var(--line-color);
            margin-left: 8px;
            gap: 12px;
        }

        .skill-card {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid var(--locked);
            transition: all 0.3s ease;
            gap: 12px;
            position: relative;
            opacity: 0.75;
        }

        .skill-card.unlocked-card {
            border-left-color: var(--unlocked);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            opacity: 1;
        }

        .skill-card::before {
            content: '';
            position: absolute;
            left: -14px;
            top: 50%;
            width: 12px;
            height: 2px;
            background-color: var(--line-color);
        }

        .skill-content {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            cursor: pointer;
            touch-action: manipulation;
        }

        .skill-img-box {
            width: 65px;
            height: 65px;
            min-width: 65px;
            border-radius: 10px;
            border: 2px solid var(--locked);
            background: var(--img-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            transition: background-color 0.3s ease, border-color 0.3s ease;
            pointer-events: none;
        }

        .unlocked-card .skill-img-box {
            border-color: var(--accent);
        }

        .skill-img-box svg {
            width: 100%;
            height: 100%;
        }

        .skill-info {
            flex-grow: 1;
            pointer-events: none;
        }

        .skill-info h4 {
            margin: 0 0 4px 0;
            font-size: 0.95rem;
        }

        .skill-info p {
            margin: 2px 0;
            font-size: 0.8rem;
            color: var(--subtext);
        }

        .actions {
            display: flex;
            gap: 6px;
            align-items: center;
            z-index: 2;
        }

        input[type="number"], input[type="email"], input[type="password"], input[type="text"] {
            width: 55px;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid var(--locked);
            background: var(--input-bg);
            color: var(--text);
            text-align: center;
            font-size: 0.9rem;
            touch-action: manipulation;
        }

        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            transition: transform 0.1s, opacity 0.2s;
            touch-action: manipulation;
        }

        body.theme-light button {
            color: #fff;
        }

        button.unlock-btn {
            background: #eab308;
            color: #000;
        }

        button.relock-btn {
            background: var(--locked);
            color: var(--subtext);
            padding: 6px 8px;
        }

        button.relock-btn:hover {
            background: var(--danger);
            color: #fff;
        }

        button:active {
            transform: scale(0.95);
        }

        /* INPUT PASSWORD WITH EYE ICON */
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .password-container input {
            width: 100% !important;
            padding-right: 40px !important;
        }

        .toggle-password-btn {
            position: absolute;
            right: 8px;
            background: none !important;
            border: none !important;
            color: var(--subtext);
            cursor: pointer;
            padding: 4px;
            font-size: 1.1rem;
            box-shadow: none !important;
        }

        /* CUSTOM MODAL POP-UP & AUTH FORMS */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.2s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-box h3 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1.2rem;
        }

        .modal-box p {
            font-size: 0.95rem;
            color: var(--text);
            line-height: 1.4;
            margin: 15px 0 20px 0;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .modal-actions button {
            padding: 10px 18px;
            font-size: 0.9rem;
            flex: 1;
        }

        .auth-form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
            text-align: left;
        }

        .auth-form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--subtext);
        }

        .auth-form-group input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            text-align: left;
        }

        .auth-hint {
            font-size: 0.75rem;
            color: var(--subtext);
            margin-top: 2px;
        }

        .auth-error {
            color: var(--danger);
            font-size: 0.85rem;
            margin-bottom: 10px;
            min-height: 18px;
        }

        .btn-cancel {
            background: var(--locked);
            color: var(--text);
        }

        .btn-confirm {
            background: var(--accent);
            color: #fff;
        }

        .btn-danger-confirm {
            background: var(--danger);
            color: #fff;
        }

        @media (max-width: 600px) {
            .header {
                position: static;
                padding-top: 0;
                padding-bottom: 5px;
            }

            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .controls-group {
                width: 100%;
                justify-content: space-between;
            }

            .custom-select {
                max-width: 150px;
            }

            .rank-card {
                padding: 10px;
            }

            .rank-badge-box {
                width: 70px;
                height: 70px;
            }

            .skill-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .skill-card::before {
                top: 35px;
            }

            .actions {
                width: 100%;
                justify-content: flex-end;
            }

            input[type="number"] {
                width: 65px;
                padding: 8px;
            }

            button {
                padding: 8px 14px;
            }
        }

        /* ========================================== */
        /* PANNELLO PROFILO PERSONALE (Altezza/Peso/BMI/Privacy) */
        /* ========================================== */
        .profile-settings-section {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            box-sizing: border-box;
            border: 1px solid var(--line-color);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            text-align: left;
            margin-bottom: 25px;
        }

        .profile-settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 600px) {
            .profile-settings-grid {
                grid-template-columns: 1fr;
            }
        }

        .profile-settings-grid input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            text-align: left;
        }

        #bmi-display-box {
            background: var(--bg-color);
            border: 1px solid var(--line-color);
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 12px;
        }

        #bmi-display-box p {
            margin: 0;
        }

        .privacy-toggle-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--locked);
            transition: .3s;
            border-radius: 24px;
        }

        .slider::before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: #fff;
            transition: .3s;
            border-radius: 50%;
        }

        .switch input:checked + .slider {
            background-color: var(--unlocked);
        }

        .switch input:checked + .slider::before {
            transform: translateX(20px);
        }

        /* ========================================== */
        /* CHAT GENERALE (widget flottante) */
        /* ========================================== */
        .chat-fab {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            z-index: 90;
            padding: 0;
        }

        .chat-panel {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 330px;
            max-width: calc(100vw - 30px);
            height: 460px;
            max-height: calc(100vh - 120px);
            background: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 95;
            transform: translateY(20px) scale(0.95);
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .chat-panel.active {
            transform: translateY(0) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .chat-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid var(--line-color);
            font-weight: bold;
            color: var(--accent);
        }

        .chat-close-btn {
            background: none;
            color: var(--subtext);
            padding: 2px 6px;
            font-size: 1rem;
        }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-message {
            background: var(--bg-color);
            border-radius: 10px;
            padding: 6px 10px;
            max-width: 85%;
            align-self: flex-start;
            border: 1px solid var(--line-color);
        }

        .chat-message.chat-message-mine {
            align-self: flex-end;
            border-color: var(--accent);
        }

        .chat-msg-author {
            display: block;
            font-size: 0.7rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 2px;
        }

        .chat-msg-text {
            font-size: 0.88rem;
            word-break: break-word;
        }

        .chat-msg-edited {
            font-size: 0.7rem;
            color: var(--subtext);
            font-style: italic;
        }

        .chat-day-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 6px 0;
        }

        .chat-day-divider span {
            font-size: 0.7rem;
            color: var(--subtext);
            background: var(--bg-color);
            border: 1px solid var(--line-color);
            border-radius: 10px;
            padding: 2px 10px;
            text-transform: capitalize;
        }

        .chat-msg-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 4px;
        }

        .chat-msg-time {
            font-size: 0.65rem;
            color: var(--subtext);
            white-space: nowrap;
        }

        // SALVATAGGIO DATI (Locale o Firebase)
        function saveState() {
            const currentXp = calculateXP();
            if (currentUser) {
                db.collection("users").doc(currentUser.uid).set({
                    nickname: userNickname || currentUser.displayName || currentUser.email.split('@')[0],
                    totalXp: currentXp,
                    skills: userState,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true }).catch(error => {
                    console.error("Errore di salvataggio su Firebase: ", error);
                });
            } else {
                localStorage.setItem('naiontrackState', JSON.stringify(userState));
            }
            updateUI();
        }

        // CARICAMENTO STATO UTENTE
        function loadUserData(user) {
            if (user) {
                currentUser = user;
                db.collection("users").doc(user.uid).get().then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        userState = data.skills || {};
                        userNickname = data.nickname || user.displayName || "";
                        userProfileData = {
                            heightCm: data.heightCm || null,
                            weightKg: data.weightKg || null,
                            isPublic: data.isPublic !== false
                        };
                    } else {
                        userState = {};
                        userNickname = user.displayName || "";
                        userProfileData = { heightCm: null, weightKg: null, isPublic: true };
                    }

                    if (!userNickname) {
                        openNicknameModal();
                    } else {
                        renderUserAuthBar();
                    }

                    updateUI();
                    renderProfileSettings();
                    initRealtimeLeaderboard();
                    if (chatPanelOpen) {
                        renderChatInputState();
                        resumeActiveChatListener();
                    }
                }).catch((error) => {
                    console.error("Errore nel recupero dati da Firestore:", error);
                });
            } else {
                currentUser = null;
                userNickname = "";
                userProfileData = {};
                document.getElementById('user-status-text').innerHTML = `👤 Non autenticato (Salvataggio locale)`;
                document.getElementById('auth-actions-container').innerHTML = `
                    <button class="btn-auth-secondary" onclick="openAuthModal('login')">Accedi</button>
                    <button class="btn-auth" onclick="openAuthModal('signup')">Registrati</button>
                `;

                userState = JSON.parse(localStorage.getItem('naiontrackState')) || {};
                updateUI();
                renderProfileSettings();
                initRealtimeLeaderboard();
                if (chatPanelOpen) {
                    renderChatInputState();
                }
            }
        }

        function calculateXP() {
            let totalXp = 0;
            categories.forEach(cat => {
                cat.skills.forEach(skill => {
                    const skillData = userState[skill.id];
                    if (skillData && skillData.unlocked) {
                        totalXp += skill.unlockXp;
                        const val = skillData.val || 0;
                        totalXp += val * skill.xpPerUnit;

                        let dynamicTarget = skill.baseTarget;
                        let completedGoalsCount = 0;
                        while (val >= dynamicTarget) {
                            completedGoalsCount++;
                            dynamicTarget += skill.step;
                        }
                        totalXp += completedGoalsCount * skill.goalBonusXp;
                    }
                });
            });
            return totalXp;
        }

        function getCurrentRank(xp) {
            let current = ranks[0];
            for (let i = 0; i < ranks.length; i++) {
                if (xp >= ranks[i].minXp) {
                    current = ranks[i];
                }
            }
            return current;
        }

        // CLASSIFICA IN TEMPO REALE CON onSnapshot
        function initRealtimeLeaderboard() {
            const container = document.getElementById('leaderboard-container');
            
            if (leaderboardUnsubscribe) {
                leaderboardUnsubscribe();
            }

            leaderboardUnsubscribe = db.collection("users").orderBy("totalXp", "desc").limit(20).onSnapshot((snapshot) => {
                if (snapshot.empty) {
                    container.innerHTML = `<p style="color: var(--subtext); text-align: center; font-size: 0.9rem;">Nessun atleta in classifica ancora.</p>`;
                    return;
                }

                let html = '';
                let index = 1;
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const xp = data.totalXp || 0;
                    const nick = data.nickname || "Anonimo";
                    const rank = getCurrentRank(xp);
                    const isMe = currentUser && currentUser.uid === doc.id;

                    html += `
                        <div class="leaderboard-item ${isMe ? 'current-user-item' : ''}" onclick="openUserProfileModal('${doc.id}')">
                            <div class="leaderboard-left">
                                <span class="leaderboard-rank-pos">#${index}</span>
                                <div class="leaderboard-avatar">${rank.iconSvg}</div>
                                <span class="leaderboard-name">${nick} ${isMe ? '(Tu)' : ''}</span>
                            </div>
                            <span class="leaderboard-xp">${xp} XP</span>
                        </div>
                    `;
                    index++;
                });

                container.innerHTML = html;
            }, (err) => {
                container.innerHTML = `<p style="color: var(--subtext); text-align: center; font-size: 0.9rem;">Registrati o accedi per vedere la classifica globale.</p>`;
            });
        }

        function updateUI() {
            const currentXp = calculateXP();
            const currentRank = getCurrentRank(currentXp);
            
            let rankIndex = ranks.indexOf(currentRank);
            let nextRank = ranks[rankIndex + 1] || currentRank;

            document.getElementById('rank-icon-box').innerHTML = currentRank.iconSvg;
            document.getElementById('user-rank').innerText = `GRADO: ${currentRank.name}`;
            document.getElementById('total-xp').innerText = `XP Totali: ${currentXp}`;
            
            const prevRankXp = currentRank.minXp;
            const nextRankXp = nextRank.minXp;
            const progressPercent = nextRankXp === prevRankXp ? 100 : Math.min(((currentXp - prevRankXp) / (nextRankXp - prevRankXp)) * 100, 100);
            document.getElementById('rank-progress').style.width = `${progressPercent}%`;

            const container = document.getElementById('tree');
            container.innerHTML = '';

            const filteredCategories = currentCategoryFilter === 'all' 
                ? categories 
                : categories.filter(c => c.id === currentCategoryFilter);

            filteredCategories.forEach(cat => {
                const catHeader = document.createElement('h3');
                catHeader.className = 'category-title';
                catHeader.innerText = cat.title;
                container.appendChild(catHeader);

                const branch = document.createElement('div');
                branch.className = 'skill-tree-branch';

                cat.skills.forEach(skill => {
                    const skillData = userState[skill.id] || { unlocked: false, val: 0 };
                    const isUnlocked = skillData.unlocked;
                    const val = skillData.val || 0;
                    
                    let dynamicTarget = skill.baseTarget;
                    let goalsReached = 0;
                    while (val >= dynamicTarget) {
                        goalsReached++;
                        dynamicTarget += skill.step;
                    }

                    const unit = skill.type === 'rep' ? 'rip' : 'sec';
                    const baseSkillXp = val * skill.xpPerUnit;
                    const totalSkillXp = isUnlocked ? (skill.unlockXp + baseSkillXp + (goalsReached * skill.goalBonusXp)) : 0;

                    const card = document.createElement('div');
                    card.className = `skill-card ${isUnlocked ? 'unlocked-card' : ''}`;

                    const stickmanSvg = skillStickmen[skill.id] || `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="20" fill="var(--accent)"/></svg>`;

                    card.innerHTML = `
                        <div class="skill-content" onclick="handleCardTap('${skill.id}')">
                            <div class="skill-img-box">
                                ${stickmanSvg}
                            </div>
                            <div class="skill-info">
                                <h4>${skill.name} ${isUnlocked ? '' : '🔒'}</h4>
                                ${isUnlocked ? `
                                    <p>Prossimo Obiettivo: <strong>${dynamicTarget} ${unit}</strong> (+${skill.goalBonusXp} XP Bonus)</p>
                                    <p style="color: var(--unlocked); font-weight: bold;">
                                        Record: ${val} ${unit} (${totalSkillXp} XP Totali)
                                    </p>
                                ` : `
                                    <p style="color: #eab308; font-weight: bold;">
                                        Sblocca per: +${skill.unlockXp} XP!
                                    </p>
                                    <p>Tocca per sbloccare</p>
                                `}
                            </div>
                        </div>
                        <div class="actions">
                            ${isUnlocked ? `
                                <input type="number" id="input-${skill.id}" value="${val}" min="0" onclick="event.stopPropagation()">
                                <button onclick="event.stopPropagation(); updateSkill('${skill.id}')">Salva</button>
                                <button class="relock-btn" title="Blocca di nuovo la skill" onclick="event.stopPropagation(); askRelock('${skill.id}')">🔒</button>
                            ` : `
                                <button class="unlock-btn" onclick="event.stopPropagation(); askUnlock('${skill.id}')">🔓 Sblocca</button>
                            `}
                        </div>
                    `;
                    branch.appendChild(card);
                });
                container.appendChild(branch);
            });
        }

        function findSkillById(id) {
            for (let cat of categories) {
                for (let s of cat.skills) {
                    if (s.id === id) return s;
                }
            }
            return null;
        }

        function openCustomModal(title, text, confirmText, isDanger, onConfirm) {
            const modal = document.getElementById('custom-modal');
            const titleEl = document.getElementById('modal-title');
            const bodyContent = document.getElementById('modal-body-content');
            const actionsBox = document.getElementById('modal-actions-box');

            titleEl.innerText = title;
            bodyContent.innerHTML = `<p id="modal-desc">${text}</p>`;
            actionsBox.innerHTML = `
                <button class="btn-cancel" id="modal-btn-cancel">Annulla</button>
                <button class="${isDanger ? 'btn-danger-confirm' : 'btn-confirm'}" id="modal-btn-confirm">${confirmText}</button>
            `;

            modal.classList.add('active');

            const close = () => {
                modal.classList.remove('active');
            };

            document.getElementById('modal-btn-cancel').onclick = close;
            document.getElementById('modal-btn-confirm').onclick = () => {
                onConfirm();
                close();
            };
        }

            titleEl.innerText = "⭐ Scegli il tuo Nickname";

            bodyContent.innerHTML = `

            actionsBox.innerHTML = `
                <button class="btn-confirm" id="save-nickname-btn">Salva Nickname</button>
            `;

            modal.classList.add('active');

            document.getElementById('save-nickname-btn').onclick = () => {
                const newNick = document.getElementById('nickname-input').value.trim();
                const errEl = document.getElementById('nickname-error-msg');

                if (!newNick) {
                    errEl.innerText = "Inserisci un nickname valido.";
                    return;
                }
                if (newNick.length < 3) {
                    errEl.innerText = "Il nickname deve avere almeno 3 caratteri.";
                    return;
                }

                errEl.innerText = "Verifica disponibilità in corso...";
                db.collection("users").where("nickname", "==", newNick).get().then((snapshot) => {
                    let isTaken = false;
                    snapshot.forEach((doc) => {
                        if (!currentUser || doc.id !== currentUser.uid) {
                            isTaken = true;
                        }
                    });

                    if (isTaken) {
                        errEl.innerText = "❌ Questo Nickname è già in uso! Scegline un altro.";
                        return;
                    }

                    userNickname = newNick;
                    modal.classList.remove('active');
                    renderUserAuthBar();
                    saveState();
                }).catch((error) => {
                    console.error("Errore controllo nickname:", error);
                    errEl.innerText = "Errore durante la verifica del nickname.";
                });
            };
        }

            modal.classList.add('active');

            document.getElementById('modal-btn-cancel').onclick = () => modal.classList.remove('active');

            document.getElementById('auth-submit-btn').onclick = () => {
                const email = document.getElementById('auth-email').value.trim();
                const password = document.getElementById('auth-password').value;
                const errorEl = document.getElementById('auth-error-msg');

                if (!email || !password) {
                    errorEl.innerText = "Compila tutti i campi.";
                    return;
                }

                if (!isLogin) {
                    const hasSpecialChar = /[!@#$%^&*(),.?":{}|<>_\-\/\\]/.test(password);
                    if (password.length < 8) {
                        errorEl.innerText = "La password deve contenere almeno 8 caratteri.";
                        return;
                    }
                    if (!hasSpecialChar) {
                        errorEl.innerText = "La password deve contenere almeno un carattere speciale.";
                        return;
                    }
                }

                const authPromise = isLogin 
                    ? auth.signInWithEmailAndPassword(email, password)
                    : auth.createUserWithEmailAndPassword(email, password);

                authPromise
                    .then(() => {
                        modal.classList.remove('active');
                    })
                    .catch((error) => {
                        errorEl.innerText = error.message;
                    });
            };
        }

        function handleCardTap(id) {
            const skillData = userState[id] || { unlocked: false, val: 0 };
            if (!skillData.unlocked) {
                askUnlock(id);
            }
        }

        function askUnlock(id) {
            const skill = findSkillById(id);
            if (!skill) return;

            openCustomModal(
                "🎉 Sblocca Skill",
                `Vuoi sbloccare <strong>"${skill.name}"</strong>?<br><br>Ottieni subito un bonus unico di <strong style="color: var(--accent);">+${skill.unlockXp} XP</strong>!`,
                "Sblocca Ora",
                false,
                () => {
                    if (!userState[id]) {
                        userState[id] = { unlocked: true, val: 0 };
                    } else {
                        userState[id].unlocked = true;
                    }
                    saveState();
                }
            );
        }

        function askRelock(id) {
            const skill = findSkillById(id);
            if (!skill) return;

            openCustomModal(
                "🔒 Riblocca Skill",
                `Vuoi bloccare di nuovo <strong>"${skill.name}"</strong>?<br><br>⚠️ La skill verrà bloccata, il punteggio azzerato e <strong>perderai tutti gli XP</strong> accumulati da essa.`,
                "Sì, Riblocca",
                true,
                () => {
                    userState[id] = { unlocked: false, val: 0 };
                    saveState();
                }
            );
        }

        function updateSkill(id) {
            const input = document.getElementById(`input-${id}`);
            if (!input) return;
            const val = parseInt(input.value) || 0;
            if (!userState[id]) {
                userState[id] = { unlocked: true, val: val };
            } else {
                userState[id].val = val;
            }
            saveState();
        }

        // ==========================================
        // UTILITY: escape HTML (anti-XSS per nickname/messaggi/testo utente)
        // ==========================================
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.innerText = str == null ? '' : String(str);
            return div.innerHTML;
        }

        // ==========================================
        // CALCOLO BMI
        // ==========================================
        function computeBmi(heightCm, weightKg) {
            const h = heightCm / 100;
            const bmi = weightKg / (h * h);
            const rounded = Math.round(bmi * 10) / 10;
            let label = '';
            if (bmi < 18.5) label = 'Sottopeso';
            else if (bmi < 25) label = 'Normopeso';
            else if (bmi < 30) label = 'Sovrappeso';
            else label = 'Obeso';
            return { value: rounded, label: label };
        }

        // ==========================================
        // PANNELLO PROFILO PERSONALE (Altezza / Peso / BMI / Privacy)
        // ==========================================
        function renderProfileSettings() {
            const container = document.getElementById('profile-settings-body');
            if (!container) return;

            if (!currentUser) {
                container.innerHTML = `<p style="color: var(--subtext); font-size: 0.85rem; text-align: center; margin: 0;">🔒 Accedi al tuo account per impostare altezza, peso e privacy del profilo.</p>`;
                return;
            }

            const height = userProfileData.heightCm || '';
            const weight = userProfileData.weightKg || '';
            const isPublic = userProfileData.isPublic !== false;

            container.innerHTML = `
                <div class="profile-settings-grid">
                    <div class="auth-form-group">
                        <label>📏 Altezza in cm (facoltativa, 120-220)</label>
                        <input type="number" id="profile-height-input" min="120" max="220" placeholder="es. 175" value="${height}">
                    </div>
                    <div class="auth-form-group">
                        <label>⚖️ Peso in kg (facoltativo, 40-130)</label>
                        <input type="number" id="profile-weight-input" min="40" max="130" placeholder="es. 70" value="${weight}">
                    </div>
                </div>
                <div id="bmi-display-box"></div>
                <div class="privacy-toggle-row">
                    <label class="switch">
                        <input type="checkbox" id="profile-public-toggle" ${isPublic ? 'checked' : ''} onchange="onPrivacyToggleChange()">
                        <span class="slider"></span>
                    </label>
                    <span id="privacy-toggle-label" style="font-size: 0.85rem; font-weight: 600;">${isPublic ? '🌐 Profilo Pubblico' : '🔒 Profilo Privato'}</span>
                </div>
                <p style="font-size: 0.75rem; color: var(--subtext); margin-top: 6px;">Se il profilo è pubblico, gli altri utenti potranno vedere le skill sbloccate, l'altezza e il peso cliccando sul tuo nome in classifica. Se è privato, nessuno potrà vederli.</p>
                <p class="auth-error" id="profile-settings-error" style="min-height: 16px; margin-top: 6px;"></p>
                <button class="btn-confirm" style="width: 100%; margin-top: 4px;" onclick="saveProfileSettings()">💾 Salva Profilo</button>
            `;

            document.getElementById('profile-height-input').oninput = updateBmiPreview;
            document.getElementById('profile-weight-input').oninput = updateBmiPreview;
            updateBmiPreview();
        }

        function onPrivacyToggleChange() {
            const checkbox = document.getElementById('profile-public-toggle');
            const label = document.getElementById('privacy-toggle-label');
            if (!checkbox || !label) return;
            label.innerText = checkbox.checked ? '🌐 Profilo Pubblico' : '🔒 Profilo Privato';
        }

        function updateBmiPreview() {
            const hInput = document.getElementById('profile-height-input');
            const wInput = document.getElementById('profile-weight-input');
            const box = document.getElementById('bmi-display-box');
            if (!hInput || !wInput || !box) return;

            const h = parseFloat(hInput.value);
            const w = parseFloat(wInput.value);

            if (h && w && h >= 120 && h <= 220 && w >= 40 && w <= 130) {
                const info = computeBmi(h, w);
                box.innerHTML = `<p>📊 Il tuo BMI: <strong>${info.value}</strong> — <strong style="color: var(--accent);">${info.label}</strong></p>`;
            } else if (hInput.value.trim() === '' && wInput.value.trim() === '') {
                box.innerHTML = `<p style="color: var(--subtext); font-size: 0.85rem;">Inserisci altezza e peso per calcolare il tuo BMI.</p>`;
            } else {
                box.innerHTML = `<p style="color: var(--subtext); font-size: 0.85rem;">Inserisci altezza (120-220 cm) e peso (40-130 kg) validi per calcolare il BMI.</p>`;
            }
        }

        function saveProfileSettings() {
            if (!currentUser) return;
            const errEl = document.getElementById('profile-settings-error');
            errEl.style.color = 'var(--danger)';
            errEl.innerText = '';

            const heightRaw = document.getElementById('profile-height-input').value.trim();
            const weightRaw = document.getElementById('profile-weight-input').value.trim();
            const isPublic = document.getElementById('profile-public-toggle').checked;

            let heightCm = null;
            let weightKg = null;

            if (heightRaw !== '') {
                const h = parseFloat(heightRaw);
                if (isNaN(h) || h < 120 || h > 220) {
                    errEl.innerText = "❌ L'altezza deve essere un numero tra 120 e 220 cm.";
                    return;
                }
                heightCm = h;
            }

            if (weightRaw !== '') {
                const w = parseFloat(weightRaw);
                if (isNaN(w) || w < 40 || w > 130) {
                    errEl.innerText = "❌ Il peso deve essere un numero tra 40 e 130 kg.";
                    return;
                }
                weightKg = w;
            }

            db.collection("users").doc(currentUser.uid).set({
                heightCm: heightCm,
                weightKg: weightKg,
                isPublic: isPublic
            }, { merge: true }).then(() => {
                userProfileData = { heightCm: heightCm, weightKg: weightKg, isPublic: isPublic };
                errEl.style.color = 'var(--unlocked)';
                errEl.innerText = "✅ Profilo salvato correttamente!";
                setTimeout(() => {
                    const e = document.getElementById('profile-settings-error');
                    if (e) { e.innerText = ''; e.style.color = 'var(--danger)'; }
                }, 2500);
            }).catch((error) => {
                console.error("Errore salvataggio profilo:", error);
                errEl.innerText = "Errore durante il salvataggio del profilo.";
            });
        }

        // ==========================================
        // MODALE PROFILO PUBBLICO (cliccando su un utente in classifica)
        // ==========================================
        function openUserProfileModal(uid) {
            const modal = document.getElementById('custom-modal');
            const titleEl = document.getElementById('modal-title');
            const bodyContent = document.getElementById('modal-body-content');
            const actionsBox = document.getElementById('modal-actions-box');

            modal.classList.add('active');
            document.getElementById('modal-btn-cancel').onclick = () => modal.classList.remove('active');

            db.collection("users").doc(uid).get().then((doc) => {
                if (!doc.exists) {
                    bodyContent.innerHTML = `<p>Utente non trovato.</p>`;
                    return;

                const data = doc.data();
                const nick = data.nickname || "Anonimo";

                    return;

                const xp = data.totalXp || 0;
                const rank = getCurrentRank(xp);
                const skillsData = data.skills || {};
                const height = data.heightCm;
                const weight = data.weightKg;

                let bmiHtml = `<p style="color: var(--subtext); font-size: 0.85rem;">Altezza e peso non inseriti.</p>`;
                if (height && weight) {
                    const info = computeBmi(height, weight);
                    bmiHtml = `
                        <p>📏 Altezza: <strong>${height} cm</strong> &nbsp;|&nbsp; ⚖️ Peso: <strong>${weight} kg</strong></p>
                        <p>📊 BMI: <strong>${info.value}</strong> — <strong style="color: var(--accent);">${info.label}</strong></p>
                    `;
                } else if (height || weight) {
                    bmiHtml = `<p>${height ? `📏 Altezza: <strong>${height} cm</strong>` : ''} ${weight ? `⚖️ Peso: <strong>${weight} kg</strong>` : ''}</p>`;
                }

                let unlockedHtml = '';
                categories.forEach(cat => {
                    const unlockedSkills = cat.skills.filter(s => skillsData[s.id] && skillsData[s.id].unlocked);
                    if (unlockedSkills.length > 0) {
                        unlockedHtml += `<p style="margin: 10px 0 4px 0; color: var(--accent); font-weight: bold; font-size: 0.85rem;">${escapeHtml(cat.title)}</p>`;
                        unlockedSkills.forEach(s => {
                            const val = skillsData[s.id].val || 0;
                            const unit = s.type === 'rep' ? 'rip' : 'sec';
                            unlockedHtml += `<p style="margin: 2px 0; font-size: 0.85rem;">✅ ${escapeHtml(s.name)}: <strong>${val} ${unit}</strong></p>`;
                        });
                    }
                });
                if (!unlockedHtml) {
                    unlockedHtml = `<p style="color: var(--subtext); font-size: 0.85rem;">Nessuna skill sbloccata ancora.</p>`;
                }

                bodyContent.innerHTML = `
                    <div style="display:flex; align-items:center; gap:12px; justify-content:center; margin-bottom: 12px;">
                        <div style="width:55px; height:55px; flex-shrink:0;">${rank.iconSvg}</div>
                        <div style="text-align:left;">
                            <p style="margin:0; font-weight:bold; font-size:1.05rem;">${escapeHtml(nick)}${isOwner ? ' (Tu)' : ''}</p>
                            <p style="margin:0; color: var(--subtext); font-size:0.85rem;">${escapeHtml(rank.name)} — ${xp} XP</p>
                        </div>
                    </div>
                    <div id="bmi-display-box" style="text-align:left;">${bmiHtml}</div>
                    <div style="text-align:left; max-height: 240px; overflow-y: auto; margin-top: 10px; border-top: 1px solid var(--line-color); padding-top: 8px;">
                        ${unlockedHtml}
                    </div>
                `;
            }).catch((error) => {
                console.error("Errore caricamento profilo utente:", error);
                bodyContent.innerHTML = `<p>Errore nel caricamento del profilo.</p>`;

        // ==========================================
        // CHAT GENERALE (solo utenti loggati)
        // ==========================================
        function toggleChatPanel() {
            const panel = document.getElementById('chat-panel');
            chatPanelOpen = !chatPanelOpen;
            panel.classList.toggle('active', chatPanelOpen);

            if (chatPanelOpen) {
                renderChatInputState();
                resumeActiveChatListener();
            }
        }

        function resumeActiveChatListener() {
            if (!currentUser) return;
            if (activeChatView === 'private-list') {
                initConversationsListener();
            } else if (activeChatView === 'private-thread' && activeConversationId) {
                initConversationMessagesListener(activeConversationId);
            } else {
                initChatListener();
            }
        }

        function switchChatTab(tab) {
            stopConversationsListener();
            stopConversationMessagesListener();
            if (chatUnsubscribe) { chatUnsubscribe(); chatUnsubscribe = null; }

            const titleEl = document.getElementById('chat-panel-title');
            const threadHeader = document.getElementById('chat-thread-header');
            const tabGeneral = document.getElementById('chat-tab-general');
            const tabPrivate = document.getElementById('chat-tab-private');

            if (tab === 'general') {
                activeChatView = 'general';
                activeConversationId = null;
                activeConversationData = null;
                threadHeader.style.display = 'none';
                titleEl.innerText = '💬 Chat Generale';
                tabGeneral.classList.add('active');
                tabPrivate.classList.remove('active');
            } else {
                activeChatView = 'private-list';
                activeConversationId = null;
                activeConversationData = null;
                threadHeader.style.display = 'none';
                titleEl.innerText = '👤 Chat Private';
                tabGeneral.classList.remove('active');
                tabPrivate.classList.add('active');
            }

            document.getElementById('chat-messages').innerHTML = `<p style="color: var(--subtext); text-align:center; font-size:0.85rem;">Caricamento...</p>`;
            renderChatInputState();
