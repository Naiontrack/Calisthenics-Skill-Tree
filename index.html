<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naiontrack's Calisthenics Progression</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151d30;
            --accent: #38bdf8;
            --locked: #334155;
            --unlocked: #22c55e;
            --text: #f8fafc;
            --line-color: #1e293b;
            --stickman-color: #a855f7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
            max-width: 900px;
            position: sticky;
            top: 0;
            background: var(--bg-color);
            padding-top: 10px;
            padding-bottom: 15px;
            z-index: 10;
        }

        .header h1 {
            margin: 0 0 15px 0;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 1.8rem;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .rank-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 2px solid var(--accent);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .rank-badge-box {
            width: 120px;
            height: 120px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.5));
        }

        .rank-badge-box svg {
            width: 100%;
            height: 100%;
        }

        .progress-bar {
            width: 100%;
            height: 14px;
            background: var(--locked);
            border-radius: 7px;
            overflow: hidden;
            margin-top: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), #818cf8);
            transition: width 0.4s ease;
        }

        .tree-container {
            display: flex;
            flex-direction: column;
            gap: 35px;
            width: 100%;
            max-width: 900px;
        }

        .category-title {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 8px;
            margin-top: 10px;
            text-transform: uppercase;
            font-size: 1.25rem;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .skill-tree-branch {
            display: flex;
            flex-direction: column;
            position: relative;
            padding-left: 20px;
            border-left: 3px dashed var(--line-color);
            margin-left: 15px;
            gap: 15px;
        }

        .skill-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 6px solid var(--locked);
            transition: all 0.3s;
            gap: 15px;
            position: relative;
        }

        .skill-card::before {
            content: '';
            position: absolute;
            left: -23px;
            top: 50%;
            width: 20px;
            height: 3px;
            background-color: var(--line-color);
        }

        .skill-card.unlocked {
            border-left-color: var(--unlocked);
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.15);
        }

        .skill-img-box {
            width: 80px;
            height: 80px;
            min-width: 80px;
            border-radius: 12px;
            border: 2px solid var(--accent);
            background: #070a12;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .skill-img-box svg {
            width: 100%;
            height: 100%;
        }

        .skill-info {
            flex-grow: 1;
        }

        .skill-info h4 {
            margin: 0 0 5px 0;
            font-size: 1.05rem;
        }

        .skill-info p {
            margin: 3px 0;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        input[type="number"] {
            width: 65px;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--locked);
            background: #0b0f19;
            color: #fff;
            text-align: center;
            font-size: 1rem;
        }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>

                ]
            }
        ];

        let userState = JSON.parse(localStorage.getItem('naiontrackState')) || {};

        function saveState() {
            localStorage.setItem('naiontrackState', JSON.stringify(userState));
            updateUI();
        }

        function calculateXP() {
            let totalXp = 0;
            categories.forEach(cat => {
                cat.skills.forEach(skill => {
                    const val = userState[skill.id] || 0;
                    totalXp += val * skill.xpPerUnit;
                });
            });
            return totalXp;
        }

        function getCurrentRank(xp) {
            let current = ranks[0];
            for (let i = 0; i < ranks.length; i++) {
                if (xp >= ranks[i].minXp) {
                    current = ranks[i];
                }
            }
            return current;
        }

        function updateUI() {
            const currentXp = calculateXP();
            const currentRank = getCurrentRank(currentXp);
            
            let rankIndex = ranks.indexOf(currentRank);
            let nextRank = ranks[rankIndex + 1] || currentRank;

            document.getElementById('rank-icon-box').innerHTML = currentRank.iconSvg;
            document.getElementById('user-rank').innerText = `GRADO: ${currentRank.name}`;
            document.getElementById('total-xp').innerText = `XP Totali: ${currentXp}`;
            
            const prevRankXp = currentRank.minXp;
            const nextRankXp = nextRank.minXp;
            const progressPercent = nextRankXp === prevRankXp ? 100 : Math.min(((currentXp - prevRankXp) / (nextRankXp - prevRankXp)) * 100, 100);
            document.getElementById('rank-progress').style.width = `${progressPercent}%`;

            const container = document.getElementById('tree');
            container.innerHTML = '';

            categories.forEach(cat => {
                const catHeader = document.createElement('h3');
                catHeader.className = 'category-title';
                catHeader.innerText = cat.title;
                container.appendChild(catHeader);

                const branch = document.createElement('div');
                branch.className = 'skill-tree-branch';

                cat.skills.forEach(skill => {
                    const val = userState[skill.id] || 0;
                    
                    let dynamicTarget = skill.baseTarget;
                    while (val >= dynamicTarget) {
                        dynamicTarget += skill.step;
                    }

                    const isUnlocked = val >= skill.baseTarget;
                    const unit = skill.type === 'rep' ? 'rip' : 'sec';
                    const skillXp = val * skill.xpPerUnit;

                    const card = document.createElement('div');
                    card.className = `skill-card ${isUnlocked ? 'unlocked' : ''}`;

                    const stickmanSvg = skillStickmen[skill.id] || `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="20" fill="#a855f7"/></svg>`;

                    card.innerHTML = `
                        <div class="skill-img-box">
                            ${stickmanSvg}
                        </div>
                        <div class="skill-info">
                            <h4>${skill.name}</h4>
                            <p>Prossimo Obiettivo: <strong>${dynamicTarget} ${unit}</strong> (+${skill.xpPerUnit} XP/${unit})</p>
                            <p style="color: ${isUnlocked ? '#22c55e' : '#38bdf8'}; font-weight: bold;">
                                Record Attuale: ${val} ${unit} (${skillXp} XP)
                            </p>
                        </div>
                        <div class="actions">
                            <input type="number" id="input-${skill.id}" value="${val}" min="0">
                            <button onclick="updateSkill('${skill.id}')">Salva</button>
                        </div>
                    `;
                    branch.appendChild(card);
                });
                container.appendChild(branch);
            });
        }

        function updateSkill(id) {
            const val = parseInt(document.getElementById(`input-${id}`).value) || 0;
            userState[id] = val;
            saveState();
        }

        updateUI();
    </script>
