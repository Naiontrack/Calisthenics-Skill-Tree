<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Occhionero's Calisthenics Tree</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            /* TEMA PREDEFINITO (Futuristic Dark) */
            --bg-color: #0b0f19;
            --card-bg: #151d30;
            --accent: #38bdf8;
            --locked: #334155;
            --unlocked: #22c55e;
            --text: #f8fafc;
            --subtext: #94a3b8;
            --line-color: #1e293b;
            --danger: #ef4444;
            --input-bg: #0b0f19;
            --img-bg: #070a12;
            --border-glow: rgba(56, 189, 248, 0.4);
        }

        /* TEMA CHIARO */
        body.theme-light {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --accent: #0284c7;
            --locked: #cbd5e1;
            --unlocked: #16a34a;
            --text: #0f172a;
            --subtext: #64748b;
            --line-color: #cbd5e1;
            --danger: #dc2626;
            --input-bg: #f8fafc;
            --img-bg: #e2e8f0;
            --border-glow: rgba(2, 132, 199, 0.25);
        }

        /* TEMA SCURO CLASSICO */
        body.theme-dark {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #bb86fc;
            --locked: #374151;
            --unlocked: #03dac6;
            --text: #e0e0e0;
            --subtext: #9ca3af;
            --line-color: #2d2d2d;
            --danger: #cf6679;
            --input-bg: #121212;
            --img-bg: #2a2a2a;
            --border-glow: rgba(187, 134, 252, 0.3);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 900px;
            position: sticky;
            top: 0;
            background: var(--bg-color);
            padding-top: 10px;
            padding-bottom: 15px;
            z-index: 10;
            transition: background-color 0.3s ease;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h1 {
            margin: 0;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.4rem;
            text-shadow: 0 0 15px var(--border-glow);
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .selector-box {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .custom-select {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--accent);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            max-width: 200px;
        }

        /* AUTH BAR STYLES */
        .auth-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 8px 15px;
            border-radius: 10px;
            border: 1px solid var(--line-color);
            margin-bottom: 15px;
            font-size: 0.9rem;
            flex-wrap: wrap;
            gap: 10px;
        }

        .auth-bar span {
            color: var(--subtext);
        }

        .auth-bar strong {
            color: var(--accent);
        }

        .auth-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-auth {
            background: var(--accent);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .btn-auth-secondary {
            background: var(--locked);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        /* SOCIAL LOGIN BUTTONS */
        .social-auth-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid var(--line-color);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-google {
            background-color: #ffffff;
            color: #000000;
        }
        .btn-google:hover {
            background-color: #f1f5f9;
        }

        .btn-apple {
            background-color: #000000;
            color: #ffffff;
        }
        .btn-apple:hover {
            background-color: #1e293b;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 15px 0;
            color: var(--subtext);
            font-size: 0.8rem;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--line-color);
        }

        .auth-divider:not(:empty)::before {
            margin-right: .5em;
        }

        .auth-divider:not(:empty)::after {
            margin-left: .5em;
        }

        .rank-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 16px;
            border: 2px solid var(--accent);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            transition: background-color 0.3s ease, border-color 0.3s ease;
            margin-bottom: 15px;
        }

        .rank-badge-box {
            width: 90px;
            height: 90px;
            margin-bottom: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 12px var(--border-glow));
        }

        .rank-badge-box svg {
            width: 100%;
            height: 100%;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: var(--locked);
            border-radius: 6px;
            overflow: hidden;
            margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--unlocked));
            transition: width 0.4s ease;
        }

        /* CLASSIFICA GLOBALE (LEADERBOARD) */
        .leaderboard-section {
            width: 100%;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            box-sizing: border-box;
            border: 1px solid var(--line-color);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            text-align: left;
            margin-bottom: 15px;
        }

        .leaderboard-title {
            color: var(--accent);
            font-size: 1.1rem;
            margin: 0 0 12px 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 6px;
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-color);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--line-color);
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .leaderboard-item:hover {
            transform: translateX(4px);
            border-color: var(--accent);
        }

        .leaderboard-item.current-user-item {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--border-glow);
        }

        .leaderboard-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .leaderboard-rank-pos {
            font-weight: bold;
            font-size: 0.9rem;
            min-width: 22px;
            color: var(--subtext);
        }

        .leaderboard-avatar {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .leaderboard-avatar svg {
            width: 100%;
            height: 100%;
        }

        .leaderboard-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .leaderboard-xp {
            font-weight: bold;
            color: var(--unlocked);
            font-size: 0.85rem;
        }

        /* SEZIONE CHAT GLOBALE */
        .chat-section {
            width: 100%;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            box-sizing: border-box;
            border: 1px solid var(--line-color);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            text-align: left;
            margin-bottom: 20px;
        }

        .chat-title {
            color: var(--accent);
            font-size: 1.1rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-messages {
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 200px;
            overflow-y: auto;
            background: var(--bg-color);
            border: 1px solid var(--line-color);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .chat-message-item {
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            word-break: break-word;
            border-left: 3px solid var(--accent);
        }

        .chat-message-item.my-message {
            border-left-color: var(--unlocked);
            align-self: flex-end;
            width: 85%;
        }

        .chat-msg-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
            font-size: 0.75rem;
        }

        .chat-msg-author {
            font-weight: bold;
            color: var(--accent);
        }

        .chat-msg-time {
            color: var(--subtext);
        }

        .chat-input-box {
            display: flex;
            gap: 8px;
        }

        .chat-input-box input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--locked);
            background: var(--input-bg);
            color: var(--text);
            text-align: left;
        }

        .tree-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 40px;
        }

        .category-title {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 6px;
            margin-top: 10px;
            text-transform: uppercase;
            font-size: 1.1rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .skill-tree-branch {
            display: flex;
            flex-direction: column;
            position: relative;
            padding-left: 12px;
            border-left: 2px dashed var(--line-color);
            margin-left: 8px;
            gap: 12px;
        }

        .skill-card {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid var(--locked);
            transition: all 0.3s ease;
            gap: 12px;
            position: relative;
            opacity: 0.75;
        }

        .skill-card.unlocked-card {
            border-left-color: var(--unlocked);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            opacity: 1;
        }

        .skill-card::before {
            content: '';
            position: absolute;
            left: -14px;
            top: 50%;
            width: 12px;
            height: 2px;
            background-color: var(--line-color);
        }

        .skill-content {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            cursor: pointer;
            touch-action: manipulation;
        }

        .skill-img-box {
            width: 65px;
            height: 65px;
            min-width: 65px;
            border-radius: 10px;
            border: 2px solid var(--locked);
            background: var(--img-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            transition: background-color 0.3s ease, border-color 0.3s ease;
            pointer-events: none;
        }

        .unlocked-card .skill-img-box {
            border-color: var(--accent);
        }

        .skill-img-box svg {
            width: 100%;
            height: 100%;
        }

        .skill-info {
            flex-grow: 1;
            pointer-events: none;
        }

        .skill-info h4 {
            margin: 0 0 4px 0;
            font-size: 0.95rem;
        }

        .skill-info p {
            margin: 2px 0;
            font-size: 0.8rem;
            color: var(--subtext);
        }

        .actions {
            display: flex;
            gap: 6px;
            align-items: center;
            z-index: 2;
        }

        input[type="number"], input[type="email"], input[type="password"], input[type="text"] {
            width: 55px;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid var(--locked);
            background: var(--input-bg);
            color: var(--text);
            text-align: center;
            font-size: 0.9rem;
            touch-action: manipulation;
        }

        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            transition: transform 0.1s, opacity 0.2s;
            touch-action: manipulation;
        }

        body.theme-light button {
            color: #fff;
        }

        button.unlock-btn {
            background: #eab308;
            color: #000;
        }

        button.relock-btn {
            background: var(--locked);
            color: var(--subtext);
            padding: 6px 8px;
        }

        button.relock-btn:hover {
            background: var(--danger);
            color: #fff;
        }

        button:active {
            transform: scale(0.95);
        }

        /* INPUT PASSWORD WITH EYE ICON */
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .password-container input {
            width: 100% !important;
            padding-right: 40px !important;
        }

        .toggle-password-btn {
            position: absolute;
            right: 8px;
            background: none !important;
            border: none !important;
            color: var(--subtext);
            cursor: pointer;
            padding: 4px;
            font-size: 1.1rem;
            box-shadow: none !important;
        }

        /* CUSTOM MODAL POP-UP & AUTH FORMS */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 20px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.2s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-box h3 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1.2rem;
        }

        .modal-box p {
            font-size: 0.95rem;
            color: var(--text);
            line-height: 1.4;
            margin: 15px 0 20px 0;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .modal-actions button {
            padding: 10px 18px;
            font-size: 0.9rem;
            flex: 1;
        }

        .auth-form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
            text-align: left;
        }

        .auth-form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--subtext);
        }

        .auth-form-group input, .auth-form-group select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            text-align: left;
            border-radius: 8px;
            border: 1px solid var(--locked);
            background: var(--input-bg);
            color: var(--text);
        }

        .auth-hint {
            font-size: 0.75rem;
            color: var(--subtext);
            margin-top: 2px;
        }

        .auth-error {
            color: var(--danger);
            font-size: 0.85rem;
            margin-bottom: 10px;
            min-height: 18px;
        }

        .btn-cancel {
            background: var(--locked);
            color: var(--text);
        }

        .btn-confirm {
            background: var(--accent);
            color: #fff;
        }

        .btn-danger-confirm {
            background: var(--danger);
            color: #fff;
        }

        /* User Profile Modal List */
        .profile-skills-list {
            text-align: left;
            max-height: 250px;
            overflow-y: auto;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .profile-skill-item {
            background: var(--bg-color);
            padding: 8px 12px;
            border-radius: 8px;
            border-left: 3px solid var(--unlocked);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            .header {
                position: static;
                padding-top: 0;
                padding-bottom: 5px;
            }

            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .controls-group {
                width: 100%;
                justify-content: space-between;
            }

            .custom-select {
                max-width: 150px;
            }

            .rank-card {
                padding: 10px;
            }

            .rank-badge-box {
                width: 70px;
                height: 70px;
            }

            .skill-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .skill-card::before {
                top: 35px;
            }

            .actions {
                width: 100%;
                justify-content: flex-end;
            }

            input[type="number"] {
                width: 65px;
                padding: 8px;
            }

            button {
                padding: 8px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="auth-bar" id="auth-bar">
            <span id="user-status-text">👤 Non autenticato (Salvataggio locale)</span>
            <div class="auth-actions" id="auth-actions-container">
                <button class="btn-auth-secondary" onclick="openAuthModal('login')">Accedi</button>
                <button class="btn-auth" onclick="openAuthModal('signup')">Registrati</button>
            </div>
        </div>

        <div class="top-bar">
            <h1>Occhionero's Calisthenics Tree</h1>
            <div class="controls-group">
                <div class="selector-box">
                    <label for="categorySelect">📁 Sezione:</label>
                    <select id="categorySelect" class="custom-select" onchange="changeCategory(this.value)">
                        <option value="all">Tutte (Tutto)</option>
                    </select>
                </div>
                <div class="selector-box">
                    <label for="themeSelect">🎨 Tema:</label>
                    <select id="themeSelect" class="custom-select" onchange="changeTheme(this.value)">
                        <option value="default">Predefinito</option>
                        <option value="light">Chiaro</option>
                        <option value="dark">Scuro</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="rank-card">
            <div id="rank-icon-box" class="rank-badge-box"></div>
            <h2 id="user-rank" style="margin:0; color: var(--accent); font-size: 1.1rem;">GRADO: Unranked</h2>
            <p id="total-xp" style="margin: 4px 0 0 0; font-weight: 600; font-size: 0.9rem;">XP Totali: 0</p>
            <div class="progress-bar">
                <div class="progress-fill" id="rank-progress"></div>
            </div>
        </div>

        <div class="leaderboard-section">
            <h3 class="leaderboard-title">🏆 Classifica Globale</h3>
            <div class="leaderboard-list" id="leaderboard-container">
                <p style="color: var(--subtext); text-align: center; font-size: 0.9rem;">Caricamento classifica...</p>
            </div>
        </div>

        <div class="chat-section">
            <h3 class="chat-title">💬 Chat Globale Community</h3>
            <div class="chat-messages" id="chat-container">
                <p style="color: var(--subtext); text-align: center; font-size: 0.85rem; margin-top: auto; margin-bottom: auto;">Effettua l'accesso per visualizzare e inviare messaggi in chat.</p>
            </div>
            <div class="chat-input-box" id="chat-controls" style="display: none;">
                <input type="text" id="chat-input-text" placeholder="Scrivi un messaggio..." maxlength="300" onkeydown="if(event.key==='Enter') sendChatMessage()">
                <button onclick="sendChatMessage()">Invia</button>
            </div>
        </div>

        let userState = {};
        let currentCategory = "all";

        function loadLocalState() {
            const saved = localStorage.getItem('calisthenics_tree_state');
            if (saved) {
                try {
                    userState = JSON.parse(saved);
                } catch(e) {
                    userState = {};
                }
            }
        }

        function saveState() {
            if (currentUser) {
                const totalXp = calculateTotalXP();
                db.collection("users").doc(currentUser.uid).set({
                    nickname: userNickname,
                    privacy: userPrivacy,
                    totalXp: totalXp,
                    skillsState: userState,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true }).catch(err => {
                    console.error("Errore nel salvataggio su Cloud:", err);
                });
            } else {
                localStorage.setItem('calisthenics_tree_state', JSON.stringify(userState));
            }
            renderTree();
            updateRank();
        }

        function calculateSkillXP(skill, val) {
            if (!val || val <= 0) return 0;
            const cappedVal = Math.min(val, skill.max);
            const linearPart = cappedVal * skill.baseRatio;
            const exponentialBonus = Math.pow(cappedVal / skill.max, 2) * (skill.baseRatio * skill.max * 0.5);
            return Math.round((linearPart + exponentialBonus) * 10);
        }

        function calculateTotalXP() {
            let total = 0;
            treeData.forEach(cat => {
                cat.skills.forEach(skill => {
                    const st = userState[skill.id];
                    if (st && st.unlocked) {
                        total += calculateSkillXP(skill, st.val);
                    }
                });
            });
            return total;
        }

        function updateRank() {
            const totalXp = calculateTotalXP();
            let currentRank = ranks[0];

            for (let i = ranks.length - 1; i >= 0; i--) {
                if (totalXp >= ranks[i].minXp) {
                    currentRank = ranks[i];
                    break;
                }
            }

            document.getElementById('user-rank').innerText = `GRADO: ${currentRank.name}`;
            document.getElementById('total-xp').innerText = `XP Totali: ${totalXp.toLocaleString('it-IT')}`;
            document.getElementById('rank-icon-box').innerHTML = currentRank.iconSvg;

            const nextRankIndex = ranks.indexOf(currentRank) + 1;
            let progressPercent = 100;
            if (nextRankIndex < ranks.length) {
                const prevXp = currentRank.minXp;
                const nextXp = ranks[nextRankIndex].minXp;
                progressPercent = Math.min(100, Math.max(0, ((totalXp - prevXp) / (nextXp - prevXp)) * 100));
            }
            document.getElementById('rank-progress').style.width = `${progressPercent}%`;
        }

        function renderTree() {
            const container = document.getElementById('tree');
            container.innerHTML = '';

            treeData.forEach(cat => {
                if (currentCategory !== "all" && cat.category !== currentCategory) return;

                const catHeader = document.createElement('h3');
                catHeader.className = 'category-title';
                catHeader.innerHTML = `<span>📂</span> ${cat.category}`;
                container.appendChild(catHeader);

                const branch = document.createElement('div');
                branch.className = 'skill-tree-branch';

                cat.skills.forEach(skill => {
                    const st = userState[skill.id] || { unlocked: false, val: 0 };
                    const xpGained = st.unlocked ? calculateSkillXP(skill, st.val) : 0;

                    const card = document.createElement('div');
                    card.className = `skill-card ${st.unlocked ? 'unlocked-card' : ''}`;

                    let actionHtml = '';
                    if (!st.unlocked) {
                        actionHtml = `<button class="unlock-btn" onclick="askUnlock('${skill.id}')">🔓 Sblocca</button>`;
                    } else {
                        actionHtml = `
                            <input type="number" id="input-${skill.id}" min="0" max="${skill.max}" value="${st.val}" onchange="updateSkill('${skill.id}')" onkeyup="updateSkill('${skill.id}')">
                            <span style="font-size:0.8rem; font-weight: bold; color: var(--subtext);">${skill.unit}</span>
                            <button class="relock-btn" onclick="askRelock('${skill.id}')" title="Riblocca skill">🔒</button>
                        `;
                    }

                    card.innerHTML = `
                        <div class="skill-content">
                            <div class="skill-img-box">${skill.img}</div>
                            <div class="skill-info">
                                <h4>${skill.name}</h4>
                                <p>Max Target: <strong>${skill.max} ${skill.unit}</strong></p>
                                <p style="color: ${st.unlocked ? 'var(--unlocked)' : 'var(--subtext)'}; font-weight: 600;">
                                    ${st.unlocked ? `XP Accumulati: +${xpGained.toLocaleString('it-IT')}` : 'Stato: Bloccata'}
                                </p>
                            </div>
                        </div>
                        <div class="actions">${actionHtml}</div>
                    `;

                    branch.appendChild(card);
                });

                container.appendChild(branch);
            });
        }

        function findSkillById(id) {
            for (const cat of treeData) {
                for (const sk of cat.skills) {
                    if (sk.id === id) return sk;
                }
            }
            return null;
        }

        function askUnlock(id) {
            const skill = findSkillById(id);
            if (!skill) return;

            openCustomModal(
                "🔓 Sblocca Skill",
                `Sei sicuro di voler sbloccare <strong>"${skill.name}"</strong>?<br><br>Sbloccandola potrai inserire i tuoi progressi e guadagnare XP!`,
                "Sblocca Ora",
                false,
                () => {
                    if (!userState[id]) {
                        userState[id] = { unlocked: true, val: 0 };
                    } else {
                        userState[id].unlocked = true;
                    }
                    saveState();
                }
            );
        }

        function askRelock(id) {
            const skill = findSkillById(id);
            if (!skill) return;

            openCustomModal(
                "🔒 Riblocca Skill",
                `Vuoi bloccare di nuovo <strong>"${skill.name}"</strong>?<br><br>⚠️ La skill verrà bloccata, il punteggio azzerato e <strong>perderai tutti gli XP</strong> accumulati da essa.`,
                "Sì, Riblocca",
                true,
                () => {
                    userState[id] = { unlocked: false, val: 0 };
                    saveState();
                }
            );
        }

        function updateSkill(id) {
            const input = document.getElementById(`input-${id}`);
            if (!input) return;
            const val = parseInt(input.value) || 0;
            if (!userState[id]) {
                userState[id] = { unlocked: true, val: val };
            } else {
                userState[id].val = val;
            }
            saveState();
        }

        function initCategorySelect() {
            const select = document.getElementById('categorySelect');
            select.innerHTML = '<option value="all">Tutte (Tutto)</option>';
            treeData.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.category;
                opt.innerText = cat.category;
                select.appendChild(opt);
            });
        }

        function changeCategory(val) {
            currentCategory = val;
            renderTree();
        }

        function changeTheme(themeKey) {
            document.body.classList.remove('theme-light', 'theme-dark');
            if (themeKey === 'light') {
                document.body.classList.add('theme-light');
            } else if (themeKey === 'dark') {
                document.body.classList.add('theme-dark');
            }
            localStorage.setItem('calisthenics_tree_theme', themeKey);
        }

        function loadSavedTheme() {
            const savedTheme = localStorage.getItem('calisthenics_tree_theme');
            if (savedTheme) {
                document.getElementById('themeSelect').value = savedTheme;
                changeTheme(savedTheme);
            }
        }

        // ==========================================
        // SISTEMA MODALE PERSONALIZZATO
        // ==========================================
        function openCustomModal(title, bodyHtml, confirmText, isDanger, onConfirm) {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body-content').innerHTML = bodyHtml;
            
            const btnCancel = document.getElementById('modal-btn-cancel');
            const btnConfirm = document.getElementById('modal-btn-confirm');

            btnConfirm.innerText = confirmText || "Conferma";
            btnConfirm.className = isDanger ? "btn-danger-confirm" : "btn-confirm";

            const closeModal = () => {
                modal.classList.remove('active');
            };

            btnCancel.onclick = closeModal;
            btnConfirm.onclick = () => {
                closeModal();
                if (onConfirm) onConfirm();
            };

            modal.classList.add('active');
        }

        // ==========================================
        // GESTIONE PRIVACY & PROFILO UTENTE DA CLASSIFICA
        // ==========================================
        function updatePrivacySetting(newPrivacy) {
            userPrivacy = newPrivacy;
            saveState();
            openCustomModal("🔒 Privacy Aggiornata", `La tua privacy è stata impostata su <strong>${newPrivacy === 'public' ? 'Pubblica' : 'Privata'}</strong>.`, "OK");
        }

        function viewUserProfile(userId, name, privacy, totalXp, skillsState) {
            if (privacy === 'private' && (!currentUser || currentUser.uid !== userId)) {
                openCustomModal(
                    `👤 Profilo di ${name}`,
                    `<p style="color: var(--subtext);">🔒 Questo utente ha impostato il proprio account come <strong>Privato</strong>.<br>Non è possibile visualizzare le sue skill sbloccate.</p>`,
                    "Chiudi"
                );
                return;
            }

            let unlockedSkillsHtml = '';
            let totalUnlockedCount = 0;

            if (skillsState) {
                treeData.forEach(cat => {
                    cat.skills.forEach(skill => {
                        const st = skillsState[skill.id];
                        if (st && st.unlocked) {
                            totalUnlockedCount++;
                            const xp = calculateSkillXP(skill, st.val);
                            unlockedSkillsHtml += `
                                <div class="profile-skill-item">
                                    <div>
                                        <strong>${skill.name}</strong><br>
                                        <span style="color: var(--subtext); font-size: 0.75rem;">${st.val} / ${skill.max} ${skill.unit}</span>
                                    </div>
                                    <span style="color: var(--unlocked); font-weight: bold;">+${xp.toLocaleString('it-IT')} XP</span>
                                </div>
                            `;
                        }
                    });
                });
            }

            if (totalUnlockedCount === 0) {
                unlockedSkillsHtml = `<p style="color: var(--subtext); font-size: 0.85rem;">Questo utente non ha ancora sbloccato alcuna skill.</p>`;
            }

            const bodyContent = `
                <div style="text-align: center; margin-bottom: 10px;">
                    <p style="margin: 5px 0;"><strong>XP Totali:</strong> <span style="color: var(--accent);">${totalXp.toLocaleString('it-IT')}</span></p>
                    <p style="margin: 5px 0; font-size: 0.85rem; color: var(--subtext);">Skill Sbloccate: ${totalUnlockedCount}</p>
                </div>
                <h4 style="margin: 10px 0 5px 0; text-align: left; color: var(--accent);">🏆 Skill Sbloccate:</h4>
                <div class="profile-skills-list">
                    ${unlockedSkillsHtml}
                </div>
            `;

            openCustomModal(`👤 Profilo: ${name}`, bodyContent, "Chiudi");
        }

        // ==========================================
        // AUTENTICAZIONE FIREBASE
        // ==========================================
        function openAuthModal(mode) {
            const isLogin = mode === 'login';
            const title = isLogin ? "🔑 Accedi al Profilo" : "📝 Registra Account";
            
            const formHtml = `
                <div class="auth-error" id="auth-error-msg"></div>
                ${!isLogin ? `
                    <div class="auth-form-group">
                        <label for="auth-nickname">Nickname Atleta</label>
                        <input type="text" id="auth-nickname" placeholder="Es. MarioCalisthenics" maxlength="20">
                    </div>
                ` : ''}
                <div class="auth-form-group">
                    <label for="auth-email">Email</label>
                    <input type="email" id="auth-email" placeholder="nome@esempio.com">
                </div>
                <div class="auth-form-group">
                    <label for="auth-password">Password</label>
                    <div class="password-container">
                        <input type="password" id="auth-password" placeholder="••••••••">
                        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('auth-password')">👁️</button>
                    </div>
                </div>
                ${!isLogin ? `
                    <div class="auth-form-group">
                        <label for="auth-privacy">Privacy Account</label>
                        <select id="auth-privacy">
                            <option value="public">🌐 Pubblico (Visibile in classifica e apribile)</option>
                            <option value="private">🔒 Privato (Nessuno può vedere le tue skill)</option>
                        </select>
                    </div>
                ` : ''}
                
                <div class="auth-divider">OPPURE</div>

                <div class="social-auth-container">
                    <button class="btn-social btn-google" onclick="handleSocialAuth('google')">
                        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                        Accedi con Google
                    </button>
                </div>
            `;

            openCustomModal(
                title,
                formHtml,
                isLogin ? "Accedi" : "Registrati",
                false,
                () => {
                    const email = document.getElementById('auth-email')?.value;
                    const password = document.getElementById('auth-password')?.value;
                    const errorBox = document.getElementById('auth-error-msg');

                    if (isLogin) {
                        auth.signInWithEmailAndPassword(email, password).catch(err => {
                            openAuthModal('login');
                            setTimeout(() => {
                                const errDiv = document.getElementById('auth-error-msg');
                                if (errDiv) errDiv.innerText = "Errore: " + translateAuthError(err.code);
                            }, 100);
                        });
                    } else {
                        const nickname = document.getElementById('auth-nickname')?.value.trim();
                        const privacy = document.getElementById('auth-privacy')?.value || 'public';
                        if (!nickname) {
                            alert("Inserisci un Nickname valido!");
                            return;
                        }
                        userNickname = nickname;
                        userPrivacy = privacy;

                        auth.createUserWithEmailAndPassword(email, password)
                            .then((cred) => {
                                return db.collection("users").doc(cred.user.uid).set({
                                    nickname: userNickname,
                                    privacy: userPrivacy,
                                    totalXp: calculateTotalXP(),
                                    skillsState: userState,
                                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                                });
                            })
                            .catch(err => {
                                openAuthModal('signup');
                                setTimeout(() => {
                                    const errDiv = document.getElementById('auth-error-msg');
                                    if (errDiv) errDiv.innerText = "Errore: " + translateAuthError(err.code);
                                }, 100);
                            });
                    }
                }
            );
        }

        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            if (input) {
                input.type = input.type === 'password' ? 'text' : 'password';
            }
        }

        function handleSocialAuth(providerName) {
            let provider = null;
            if (providerName === 'google') {
                provider = new firebase.auth.GoogleAuthProvider();
            }

            if (provider) {
                auth.signInWithPopup(provider).catch(err => {
                    alert("Errore accesso Social: " + err.message);
                });
            }
        }

        function translateAuthError(code) {
            switch (code) {
                case 'auth/invalid-email': return 'Indirizzo email non valido.';
                case 'auth/user-disabled': return 'Questo utente è stato disabilitato.';
                case 'auth/user-not-found': return 'Nessun utente trovato con questa email.';
                case 'auth/wrong-password': return 'Password errata.';
                case 'auth/email-already-in-use': return 'L\'email è già utilizzata da un altro account.';
                case 'auth/weak-password': return 'La password deve contenere almeno 6 caratteri.';
                default: return 'Si è verificato un errore durante l\'autenticazione.';
            }
        }

        function logout() {
            auth.signOut().then(() => {
                location.reload();
            });
        }

        auth.onAuthStateChanged((user) => {
            currentUser = user;
            const authBar = document.getElementById('auth-bar');
            const authStatusText = document.getElementById('user-status-text');
            const authActionsContainer = document.getElementById('auth-actions-container');
            const chatControls = document.getElementById('chat-controls');

            if (user) {
                db.collection("users").doc(user.uid).get().then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        userNickname = data.nickname || user.displayName || "Atleta";
                        userPrivacy = data.privacy || "public";
                        if (data.skillsState) {
                            userState = data.skillsState;
                        }
                    } else {
                        userNickname = user.displayName || "Atleta";
                        userPrivacy = "public";
                        saveState();
                    }
                    
                    authStatusText.innerHTML = `👤 Loggato come: <strong>${userNickname}</strong> (${userPrivacy === 'public' ? '🌐 Pubblico' : '🔒 Privato'})`;
                    authActionsContainer.innerHTML = `
                        <button class="btn-auth-secondary" onclick="updatePrivacySetting('${userPrivacy === 'public' ? 'private' : 'public'}')">
                            Cambia Privacy (${userPrivacy === 'public' ? 'Rendi Privato 🔒' : 'Rendi Pubblico 🌐'})
                        </button>
                        <button class="btn-auth-secondary" onclick="logout()">Esci</button>
                    `;

                    chatControls.style.display = 'flex';

                    renderTree();
                    updateRank();
                    listenLeaderboard();
                    listenChat();
                });
            } else {
                authStatusText.innerText = '👤 Non autenticato (Salvataggio locale)';
                authActionsContainer.innerHTML = `
                    <button class="btn-auth-secondary" onclick="openAuthModal('login')">Accedi</button>
                    <button class="btn-auth" onclick="openAuthModal('signup')">Registrati</button>
                `;
                chatControls.style.display = 'none';

                loadLocalState();
                renderTree();
                updateRank();
                listenLeaderboard();
            }
        });

        // ==========================================
        // CLASSIFICA GLOBALE IN TEMPO REALE
        // ==========================================
        function listenLeaderboard() {
            if (leaderboardUnsubscribe) leaderboardUnsubscribe();

            const leaderboardContainer = document.getElementById('leaderboard-container');

            leaderboardUnsubscribe = db.collection("users")
                .orderBy("totalXp", "desc")
                .limit(20)
                .onSnapshot((snapshot) => {
                    if (snapshot.empty) {
                        leaderboardContainer.innerHTML = '<p style="color: var(--subtext); text-align: center; font-size: 0.9rem;">Nessun atleta in classifica.</p>';
                        return;
                    }

                    leaderboardContainer.innerHTML = '';
                    let rankPos = 1;

                    snapshot.forEach((doc) => {
                        const userData = doc.data();
                        const isCurrent = currentUser && currentUser.uid === doc.id;
                        
                        let rankIcon = rankLogos.bronze;
                        for (let i = ranks.length - 1; i >= 0; i--) {
                            if ((userData.totalXp || 0) >= ranks[i].minXp) {
                                rankIcon = ranks[i].iconSvg;
                                break;
                            }
                        }

                        const item = document.createElement('div');
                        item.className = `leaderboard-item ${isCurrent ? 'current-user-item' : ''}`;
                        
                        const jsonState = JSON.stringify(userData.skillsState || {}).replace(/'/g, "&apos;");
                        
                        item.setAttribute("onclick", `viewUserProfile('${doc.id}', '${userData.nickname || 'Atleta Anonimo'}', '${userData.privacy || 'public'}', ${userData.totalXp || 0}, ${jsonState})`);

                        item.innerHTML = `
                            <div class="leaderboard-left">
                                <span class="leaderboard-rank-pos">#${rankPos}</span>
                                <div class="leaderboard-avatar">${rankIcon}</div>
                                <span class="leaderboard-name">${userData.nickname || 'Atleta Anonimo'} ${userData.privacy === 'private' ? '🔒' : ''}</span>
                            </div>
                            <span class="leaderboard-xp">${(userData.totalXp || 0).toLocaleString('it-IT')} XP</span>
                        `;

                        leaderboardContainer.appendChild(item);
                        rankPos++;
                    });
                }, (error) => {
                    console.error("Errore ascolto classifica:", error);
                    leaderboardContainer.innerHTML = '<p style="color: var(--danger); text-align: center; font-size: 0.85rem;">Impossibile caricare la classifica.</p>';
                });
        }

        // ==========================================
        // CHAT GLOBALE IN TEMPO REALE
        // ==========================================
        function listenChat() {
            if (chatUnsubscribe) chatUnsubscribe();

            const chatContainer = document.getElementById('chat-container');

            chatUnsubscribe = db.collection("chat")
                .orderBy("createdAt", "asc")
                .limitToLast(50)
                .onSnapshot((snapshot) => {
                    if (snapshot.empty) {
                        chatContainer.innerHTML = '<p style="color: var(--subtext); text-align: center; font-size: 0.85rem; margin-top: auto; margin-bottom: auto;">Nessun messaggio presente. Scrivi il primo messaggio!</p>';
                        return;
                    }

                    chatContainer.innerHTML = '';
                    snapshot.forEach((doc) => {
                        const msgData = doc.data();
                        const isMe = currentUser && currentUser.uid === msgData.uid;

                        let timeStr = "";
                        if (msgData.createdAt) {
                            const date = msgData.createdAt.toDate();
                            timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        }

                        const msgItem = document.createElement('div');
                        msgItem.className = `chat-message-item ${isMe ? 'my-message' : ''}`;
                        msgItem.innerHTML = `
                            <div class="chat-msg-header">
                                <span class="chat-msg-author">${msgData.author || 'Atleta'}</span>
                                <span class="chat-msg-time">${timeStr}</span>
                            </div>
                            <div>${escapeHtml(msgData.text)}</div>
                        `;
                        chatContainer.appendChild(msgItem);
                    });

                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }, (error) => {
                    console.error("Errore chat:", error);
                });
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input-text');
            if (!input || !currentUser) return;

            const text = input.value.trim();
            if (!text) return;

            db.collection("chat").add({
                uid: currentUser.uid,
                author: userNickname || "Atleta",
                text: text,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                input.value = '';
            }).catch(err => {
                console.error("Errore nell'invio del messaggio:", err);
            });
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // ==========================================
        // INIZIALIZZAZIONE ALL'AVVIO
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            initCategorySelect();
            loadSavedTheme();
        });
    </script>
</body>
</html>
