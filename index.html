<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Occhionero's Calisthenics Tree</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            /* TEMA PREDEFINITO (Futuristic Dark) */
            --bg-color: #0b0f19;
            --card-bg: #151d30;
            --accent: #38bdf8;
            --locked: #334155;
            --unlocked: #22c55e;
            --text: #f8fafc;
            --subtext: #94a3b8;
            --line-color: #1e293b;
            --danger: #ef4444;
            --input-bg: #0b0f19;
            --img-bg: #070a12;
            --border-glow: rgba(56, 189, 248, 0.4);
        }

        /* TEMA CHIARO */
        body.theme-light {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --accent: #0284c7;
            --locked: #cbd5e1;
            --unlocked: #16a34a;
            --text: #0f172a;
            --subtext: #64748b;
            --line-color: #cbd5e1;
            --danger: #dc2626;
            --input-bg: #f8fafc;
            --img-bg: #e2e8f0;
            --border-glow: rgba(2, 132, 199, 0.25);
        }

        /* TEMA SCURO CLASSICO */
        body.theme-dark {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #bb86fc;
            --locked: #374151;
            --unlocked: #03dac6;
            --text: #e0e0e0;
            --subtext: #9ca3af;
            --line-color: #2d2d2d;
            --danger: #cf6679;
            --input-bg: #121212;
            --img-bg: #2a2a2a;
            --border-glow: rgba(187, 134, 252, 0.3);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 900px;
            position: sticky;
            top: 0;
            background: var(--bg-color);
            padding-top: 10px;
            padding-bottom: 15px;
            z-index: 10;
            transition: background-color 0.3s ease;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h1 {
            margin: 0;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.4rem;
            text-shadow: 0 0 15px var(--border-glow);
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .selector-box {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .custom-select {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--accent);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            max-width: 200px;
        }

        /* AUTH BAR STYLES */
        .auth-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 8px 15px;
            border-radius: 10px;
            border: 1px solid var(--line-color);
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .auth-bar span {
            color: var(--subtext);
        }

        .auth-bar strong {
            color: var(--accent);
        }

        .auth-actions {
            display: flex;
            gap: 8px;
        }

        .btn-auth {
            background: var(--accent);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .btn-auth-secondary {
            background: var(--locked);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        /* SOCIAL LOGIN BUTTONS */
        .social-auth-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid var(--line-color);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-google {
            background-color: #ffffff;
            color: #000000;
        }
        .btn-google:hover {
            background-color: #f1f5f9;
        }

        .btn-apple {
            background-color: #000000;
            color: #ffffff;
        }
        .btn-apple:hover {
            background-color: #1e293b;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 15px 0;
            color: var(--subtext);
            font-size: 0.8rem;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--line-color);
        }

        .auth-divider:not(:empty)::before {
            margin-right: .5em;
        }

        .auth-divider:not(:empty)::after {
            margin-left: .5em;
        }

        .rank-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 16px;
            border: 2px solid var(--accent);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            transition: background-color 0.3s ease, border-color 0.3s ease;
            margin-bottom: 15px;
        }

        .rank-badge-box {
            width: 90px;
            height: 90px;
            margin-bottom: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 12px var(--border-glow));
        }

        .rank-badge-box svg {
            width: 100%;
            height: 100%;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: var(--locked);
            border-radius: 6px;
            overflow: hidden;
            margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--unlocked));
            transition: width 0.4s ease;
        }

        /* CLASSIFICA GLOBALE (LEADERBOARD) - POSIZIONATA IN HEADER */
        .leaderboard-section {
            width: 100%;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            box-sizing: border-box;
            border: 1px solid var(--line-color);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            text-align: left;
        }

        .leaderboard-title {
            color: var(--accent);
            font-size: 1.1rem;
            margin: 0 0 12px 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 6px;
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-color);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--line-color);
        }

        .leaderboard-item.current-user-item {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--border-glow);
        }

        .leaderboard-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .leaderboard-rank-pos {
            font-weight: bold;
            font-size: 0.9rem;
            min-width: 22px;
            color: var(--subtext);
        }

        .leaderboard-avatar {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .leaderboard-avatar svg {
            width: 100%;
            height: 100%;
        }

        .leaderboard-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .leaderboard-xp {
            font-weight: bold;
            color: var(--unlocked);
            font-size: 0.85rem;
        }

        .tree-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 40px;
        }

        .category-title {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 6px;
            margin-top: 10px;
            text-transform: uppercase;
            font-size: 1.1rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .skill-tree-branch {
            display: flex;
            flex-direction: column;
            position: relative;
            padding-left: 12px;
            border-left: 2px dashed var(--line-color);
            margin-left: 8px;
            gap: 12px;
        }

        .skill-card {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid var(--locked);
            transition: all 0.3s ease;
            gap: 12px;
            position: relative;
            opacity: 0.75;
        }

        .skill-card.unlocked-card {
            border-left-color: var(--unlocked);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            opacity: 1;
        }

        .skill-card::before {
            content: '';
            position: absolute;
            left: -14px;
            top: 50%;
            width: 12px;
            height: 2px;
            background-color: var(--line-color);
        }

        .skill-content {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            cursor: pointer;
            touch-action: manipulation;
        }

        .skill-img-box {
            width: 65px;
            height: 65px;
            min-width: 65px;
            border-radius: 10px;
            border: 2px solid var(--locked);
            background: var(--img-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            transition: background-color 0.3s ease, border-color 0.3s ease;
            pointer-events: none;
        }

        .unlocked-card .skill-img-box {
            border-color: var(--accent);
        }

        .skill-img-box svg {
            width: 100%;
            height: 100%;
        }

        .skill-info {
            flex-grow: 1;
            pointer-events: none;
        }

        .skill-info h4 {
            margin: 0 0 4px 0;
            font-size: 0.95rem;
        }

        .skill-info p {
            margin: 2px 0;
            font-size: 0.8rem;
            color: var(--subtext);
        }

        .actions {
            display: flex;
            gap: 6px;
            align-items: center;
            z-index: 2;
        }

        input[type="number"], input[type="email"], input[type="password"], input[type="text"] {
            width: 55px;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid var(--locked);
            background: var(--input-bg);
            color: var(--text);
            text-align: center;
            font-size: 0.9rem;
            touch-action: manipulation;
        }

        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            transition: transform 0.1s, opacity 0.2s;
            touch-action: manipulation;
        }

        body.theme-light button {
            color: #fff;
        }

        button.unlock-btn {
            background: #eab308;
            color: #000;
        }

        button.relock-btn {
            background: var(--locked);
            color: var(--subtext);
            padding: 6px 8px;
        }

        button.relock-btn:hover {
            background: var(--danger);
            color: #fff;
        }

        button:active {
            transform: scale(0.95);
        }

        /* INPUT PASSWORD WITH EYE ICON */
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .password-container input {
            width: 100% !important;
            padding-right: 40px !important;
        }

        .toggle-password-btn {
            position: absolute;
            right: 8px;
            background: none !important;
            border: none !important;
            color: var(--subtext);
            cursor: pointer;
            padding: 4px;
            font-size: 1.1rem;
            box-shadow: none !important;
        }

        /* CUSTOM MODAL POP-UP & AUTH FORMS */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.2s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-box h3 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1.2rem;
        }

        .modal-box p {
            font-size: 0.95rem;
            color: var(--text);
            line-height: 1.4;
            margin: 15px 0 20px 0;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .modal-actions button {
            padding: 10px 18px;
            font-size: 0.9rem;
            flex: 1;
        }

        .auth-form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
            text-align: left;
        }

        .auth-form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--subtext);
        }

        .auth-form-group input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            text-align: left;
        }

        .auth-hint {
            font-size: 0.75rem;
            color: var(--subtext);
            margin-top: 2px;
        }

        .auth-error {
            color: var(--danger);
            font-size: 0.85rem;
            margin-bottom: 10px;
            min-height: 18px;
        }

        .btn-cancel {
            background: var(--locked);
            color: var(--text);
        }

        .btn-confirm {
            background: var(--accent);
            color: #fff;
        }

        .btn-danger-confirm {
            background: var(--danger);
            color: #fff;
        }

        @media (max-width: 600px) {
            .header {
                position: static;
                padding-top: 0;
                padding-bottom: 5px;
            }

            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .controls-group {
                width: 100%;
                justify-content: space-between;
            }

            .custom-select {
                max-width: 150px;
            }

            .rank-card {
                padding: 10px;
            }

            .rank-badge-box {
                width: 70px;
                height: 70px;
            }

            .skill-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .skill-card::before {
                top: 35px;
            }

            .actions {
                width: 100%;
                justify-content: flex-end;
            }

            input[type="number"] {
                width: 65px;
                padding: 8px;
            }

            button {
                padding: 8px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="auth-bar" id="auth-bar">
            <span id="user-status-text">👤 Non autenticato (Salvataggio locale)</span>
            <div class="auth-actions" id="auth-actions-container">
                <button class="btn-auth-secondary" onclick="openAuthModal('login')">Accedi</button>
                <button class="btn-auth" onclick="openAuthModal('signup')">Registrati</button>
            </div>
        </div>

        <div class="top-bar">
            <h1>Occhionero's Calisthenics Tree</h1>
            <div class="controls-group">
                <div class="selector-box">
                    <label for="categorySelect">📁 Sezione:</label>
                    <select id="categorySelect" class="custom-select" onchange="changeCategory(this.value)">
                        <option value="all">Tutte (Tutto)</option>
                    </select>
                </div>
                <div class="selector-box">
                    <label for="themeSelect">🎨 Tema:</label>
                    <select id="themeSelect" class="custom-select" onchange="changeTheme(this.value)">
                        <option value="default">Predefinito</option>
                        <option value="light">Chiaro</option>
                        <option value="dark">Scuro</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="rank-card">
            <div id="rank-icon-box" class="rank-badge-box"></div>
            <h2 id="user-rank" style="margin:0; color: var(--accent); font-size: 1.1rem;">GRADO: Unranked</h2>
            <p id="total-xp" style="margin: 4px 0 0 0; font-weight: 600; font-size: 0.9rem;">XP Totali: 0</p>
            <div class="progress-bar">
                <div class="progress-fill" id="rank-progress"></div>
            </div>
        </div>

        <!-- CLASSIFICA GLOBALE SPOSTATA SOTTO AL RANK -->
        <div class="leaderboard-section">
            <h3 class="leaderboard-title">🏆 Classifica Globale</h3>
            <div class="leaderboard-list" id="leaderboard-container">
                <p style="color: var(--subtext); text-align: center; font-size: 0.9rem;">Caricamento classifica...</p>
            </div>
        </div>
    </div>

    <div class="tree-container" id="tree"></div>

    <div class="modal-overlay" id="custom-modal">
        <div class="modal-box">
            <h3 id="modal-title">Titolo</h3>
            <div id="modal-body-content">
                <p id="modal-desc">Descrizione del messaggio</p>
            </div>
            <div class="modal-actions" id="modal-actions-box">
                <button class="btn-cancel" id="modal-btn-cancel">Annulla</button>
                <button class="btn-confirm" id="modal-btn-confirm">Conferma</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURAZIONE FIREBASE

        const firebaseConfig = {

        function applyTheme(theme) {
            document.body.classList.remove('theme-light', 'theme-dark');
            if (theme === 'light') {
                document.body.classList.add('theme-light');
            } else if (theme === 'dark') {
                document.body.classList.add('theme-dark');
            }
            document.getElementById('themeSelect').value = theme;
        }

            currentTheme = theme;
            localStorage.setItem('naiontrackTheme', theme);
            applyTheme(theme);

        // SALVATAGGIO DATI (Locale o Firebase)
        function saveState() {
            const currentXp = calculateXP();
            if (currentUser) {
                db.collection("users").doc(currentUser.uid).set({
                    nickname: userNickname || currentUser.displayName || currentUser.email.split('@')[0],
                    totalXp: currentXp,
                    skills: userState,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true }).catch(error => {
                    console.error("Errore di salvataggio su Firebase: ", error);
                });
            } else {
                localStorage.setItem('naiontrackState', JSON.stringify(userState));
            }
            updateUI();
        }

        // CARICAMENTO STATO UTENTE
        function loadUserData(user) {
            if (user) {
                currentUser = user;
                db.collection("users").doc(user.uid).get().then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        userState = data.skills || {};
                        userNickname = data.nickname || user.displayName || "";
                    } else {
                        userState = {};
                        userNickname = user.displayName || "";
                    }

                    if (!userNickname) {
                        openNicknameModal();
                    } else {
                        renderUserAuthBar();
                    }

                    updateUI();
                    initRealtimeLeaderboard();
                }).catch((error) => {
                    console.error("Errore nel recupero dati da Firestore:", error);
                });
            } else {
                currentUser = null;
                userNickname = "";
                document.getElementById('user-status-text').innerHTML = `👤 Non autenticato (Salvataggio locale)`;
                document.getElementById('auth-actions-container').innerHTML = `
                    <button class="btn-auth-secondary" onclick="openAuthModal('login')">Accedi</button>
                    <button class="btn-auth" onclick="openAuthModal('signup')">Registrati</button>
                `;

                userState = JSON.parse(localStorage.getItem('naiontrackState')) || {};
                updateUI();
                initRealtimeLeaderboard();
            }
        }

            const displayName = userNickname || (currentUser ? (currentUser.displayName || currentUser.email) : "");

            document.getElementById('auth-actions-container').innerHTML = `

        function logoutUser() {
            auth.signOut().then(() => {
                userState = JSON.parse(localStorage.getItem('naiontrackState')) || {};
                updateUI();
                initRealtimeLeaderboard();
            });
        }

        function calculateXP() {
            let totalXp = 0;
            categories.forEach(cat => {
                cat.skills.forEach(skill => {
                    const skillData = userState[skill.id];
                    if (skillData && skillData.unlocked) {
                        totalXp += skill.unlockXp;
                        const val = skillData.val || 0;
                        totalXp += val * skill.xpPerUnit;

                        let dynamicTarget = skill.baseTarget;
                        let completedGoalsCount = 0;
                        while (val >= dynamicTarget) {
                            completedGoalsCount++;
                            dynamicTarget += skill.step;
                        }
                        totalXp += completedGoalsCount * skill.goalBonusXp;
                    }
                });
            });
            return totalXp;
        }

        function getCurrentRank(xp) {
            let current = ranks[0];
            for (let i = 0; i < ranks.length; i++) {
                if (xp >= ranks[i].minXp) {
                    current = ranks[i];
                }
            }
            return current;
        }

        // CLASSIFICA IN TEMPO REALE CON onSnapshot
        function initRealtimeLeaderboard() {
            const container = document.getElementById('leaderboard-container');
            
            if (leaderboardUnsubscribe) {
                leaderboardUnsubscribe();
            }

            leaderboardUnsubscribe = db.collection("users").orderBy("totalXp", "desc").limit(20).onSnapshot((snapshot) => {
                if (snapshot.empty) {
                    container.innerHTML = `<p style="color: var(--subtext); text-align: center; font-size: 0.9rem;">Nessun atleta in classifica ancora.</p>`;
                    return;
                }

                let html = '';
                let index = 1;
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const xp = data.totalXp || 0;
                    const nick = data.nickname || "Anonimo";
                    const rank = getCurrentRank(xp);
                    const isMe = currentUser && currentUser.uid === doc.id;

                    html += `
                        <div class="leaderboard-item ${isMe ? 'current-user-item' : ''}">
                            <div class="leaderboard-left">
                                <span class="leaderboard-rank-pos">#${index}</span>
                                <div class="leaderboard-avatar">${rank.iconSvg}</div>
                                <span class="leaderboard-name">${nick} ${isMe ? '(Tu)' : ''}</span>
                            </div>
                            <span class="leaderboard-xp">${xp} XP</span>
                        </div>
                    `;
                    index++;
                });

                container.innerHTML = html;
            }, (err) => {
                container.innerHTML = `<p style="color: var(--subtext); text-align: center; font-size: 0.9rem;">Registrati o accedi per vedere la classifica globale.</p>`;
            });
        }

        function updateUI() {
            const currentXp = calculateXP();
            const currentRank = getCurrentRank(currentXp);
            
            let rankIndex = ranks.indexOf(currentRank);
            let nextRank = ranks[rankIndex + 1] || currentRank;

            document.getElementById('rank-icon-box').innerHTML = currentRank.iconSvg;
            document.getElementById('user-rank').innerText = `GRADO: ${currentRank.name}`;
            document.getElementById('total-xp').innerText = `XP Totali: ${currentXp}`;
            
            const prevRankXp = currentRank.minXp;
            const nextRankXp = nextRank.minXp;
            const progressPercent = nextRankXp === prevRankXp ? 100 : Math.min(((currentXp - prevRankXp) / (nextRankXp - prevRankXp)) * 100, 100);
            document.getElementById('rank-progress').style.width = `${progressPercent}%`;

            const container = document.getElementById('tree');
            container.innerHTML = '';

            const filteredCategories = currentCategoryFilter === 'all' 
                ? categories 
                : categories.filter(c => c.id === currentCategoryFilter);

            filteredCategories.forEach(cat => {
                const catHeader = document.createElement('h3');
                catHeader.className = 'category-title';
                catHeader.innerText = cat.title;
                container.appendChild(catHeader);

                const branch = document.createElement('div');
                branch.className = 'skill-tree-branch';

                cat.skills.forEach(skill => {
                    const skillData = userState[skill.id] || { unlocked: false, val: 0 };
                    const isUnlocked = skillData.unlocked;
                    const val = skillData.val || 0;
                    
                    let dynamicTarget = skill.baseTarget;
                    let goalsReached = 0;
                    while (val >= dynamicTarget) {
                        goalsReached++;
                        dynamicTarget += skill.step;
                    }

                    const unit = skill.type === 'rep' ? 'rip' : 'sec';
                    const baseSkillXp = val * skill.xpPerUnit;
                    const totalSkillXp = isUnlocked ? (skill.unlockXp + baseSkillXp + (goalsReached * skill.goalBonusXp)) : 0;

                    const card = document.createElement('div');
                    card.className = `skill-card ${isUnlocked ? 'unlocked-card' : ''}`;

                    const stickmanSvg = skillStickmen[skill.id] || `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="20" fill="var(--accent)"/></svg>`;

                    card.innerHTML = `
                        <div class="skill-content" onclick="handleCardTap('${skill.id}')">
                            <div class="skill-img-box">
                                ${stickmanSvg}
                            </div>
                            <div class="skill-info">
                                <h4>${skill.name} ${isUnlocked ? '' : '🔒'}</h4>
                                ${isUnlocked ? `
                                    <p>Prossimo Obiettivo: <strong>${dynamicTarget} ${unit}</strong> (+${skill.goalBonusXp} XP Bonus)</p>
                                    <p style="color: var(--unlocked); font-weight: bold;">
                                        Record: ${val} ${unit} (${totalSkillXp} XP Totali)
                                    </p>
                                ` : `
                                    <p style="color: #eab308; font-weight: bold;">
                                        Sblocca per: +${skill.unlockXp} XP!
                                    </p>
                                    <p>Tocca per sbloccare</p>
                                `}
                            </div>
                        </div>
                        <div class="actions">
                            ${isUnlocked ? `
                                <input type="number" id="input-${skill.id}" value="${val}" min="0" onclick="event.stopPropagation()">
                                <button onclick="event.stopPropagation(); updateSkill('${skill.id}')">Salva</button>
                                <button class="relock-btn" title="Blocca di nuovo la skill" onclick="event.stopPropagation(); askRelock('${skill.id}')">🔒</button>
                            ` : `
                                <button class="unlock-btn" onclick="event.stopPropagation(); askUnlock('${skill.id}')">🔓 Sblocca</button>
                            `}
                        </div>
                    `;
                    branch.appendChild(card);
                });
                container.appendChild(branch);
            });
        }

        function findSkillById(id) {
            for (let cat of categories) {
                for (let s of cat.skills) {
                    if (s.id === id) return s;
                }
            }
            return null;
        }

        function openCustomModal(title, text, confirmText, isDanger, onConfirm) {
            const modal = document.getElementById('custom-modal');
            const titleEl = document.getElementById('modal-title');
            const bodyContent = document.getElementById('modal-body-content');
            const actionsBox = document.getElementById('modal-actions-box');

            titleEl.innerText = title;
            bodyContent.innerHTML = `<p id="modal-desc">${text}</p>`;
            actionsBox.innerHTML = `
                <button class="btn-cancel" id="modal-btn-cancel">Annulla</button>
                <button class="${isDanger ? 'btn-danger-confirm' : 'btn-confirm'}" id="modal-btn-confirm">${confirmText}</button>
            `;

            modal.classList.add('active');

            const close = () => {
                modal.classList.remove('active');
            };

            document.getElementById('modal-btn-cancel').onclick = close;
            document.getElementById('modal-btn-confirm').onclick = () => {
                onConfirm();
                close();
            };
        }

        function togglePasswordVisibility(inputId, btnEl) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btnEl.innerText = "🙈";
            } else {
                input.type = "password";
                btnEl.innerText = "👁️";
            }
        }

        // MODALE NICKNAME CON VERIFICA DI UNICITÀ SU FIRESTORE
        function openNicknameModal() {
            const modal = document.getElementById('custom-modal');
            const titleEl = document.getElementById('modal-title');
            const bodyContent = document.getElementById('modal-body-content');
            const actionsBox = document.getElementById('modal-actions-box');

            titleEl.innerText = "⭐ Scegli il tuo Nickname";

            bodyContent.innerHTML = `
                <div class="auth-error" id="nickname-error-msg"></div>
                <p style="font-size:0.85rem; color:var(--subtext); margin-bottom: 10px;">Questo nome sarà visibile nella classifica globale.</p>
                <div class="auth-form-group">
                    <label>Nickname</label>
                    <input type="text" id="nickname-input" placeholder="es. SpartaAtleta" value="${userNickname}">
                </div>
            `;

            actionsBox.innerHTML = `
                <button class="btn-confirm" id="save-nickname-btn">Salva Nickname</button>
            `;

            modal.classList.add('active');

            document.getElementById('save-nickname-btn').onclick = () => {
                const newNick = document.getElementById('nickname-input').value.trim();
                const errEl = document.getElementById('nickname-error-msg');

                if (!newNick) {
                    errEl.innerText = "Inserisci un nickname valido.";
                    return;
                }
                if (newNick.length < 3) {
                    errEl.innerText = "Il nickname deve avere almeno 3 caratteri.";
                    return;
                }

                errEl.innerText = "Verifica disponibilità in corso...";
                db.collection("users").where("nickname", "==", newNick).get().then((snapshot) => {
                    let isTaken = false;
                    snapshot.forEach((doc) => {
                        if (!currentUser || doc.id !== currentUser.uid) {
                            isTaken = true;
                        }
                    });

                    if (isTaken) {
                        errEl.innerText = "❌ Questo Nickname è già in uso! Scegline un altro.";
                        return;
                    }

                    userNickname = newNick;
                    modal.classList.remove('active');
                    renderUserAuthBar();
                    saveState();
                }).catch((error) => {
                    console.error("Errore controllo nickname:", error);
                    errEl.innerText = "Errore durante la verifica del nickname.";
                });
            };
        }

        // ACCESSO TRAMITE GOOGLE
        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then(() => {
                    document.getElementById('custom-modal').classList.remove('active');
                })
                .catch((error) => {
                    const errorEl = document.getElementById('auth-error-msg');
                    if (errorEl) errorEl.innerText = error.message;
                });
        }

        // ACCESSO TRAMITE APPLE
        function loginWithApple() {
            const provider = new firebase.auth.OAuthProvider('apple.com');
            auth.signInWithPopup(provider)
                .then(() => {
                    document.getElementById('custom-modal').classList.remove('active');
                })
                .catch((error) => {
                    const errorEl = document.getElementById('auth-error-msg');
                    if (errorEl) errorEl.innerText = error.message;
                });
        }

        function openAuthModal(mode) {
            const modal = document.getElementById('custom-modal');
            const titleEl = document.getElementById('modal-title');
            const bodyContent = document.getElementById('modal-body-content');
            const actionsBox = document.getElementById('modal-actions-box');

            const isLogin = mode === 'login';
            titleEl.innerText = isLogin ? "🔑 Accedi al tuo Account" : "✨ Registrati";

            bodyContent.innerHTML = `
                <div class="auth-error" id="auth-error-msg"></div>

                <div class="social-auth-container">
                    <button class="btn-social btn-google" onclick="loginWithGoogle()">
                        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                        Continua con Google
                    </button>
                    <button class="btn-social btn-apple" onclick="loginWithApple()">
                        <svg width="18" height="18" viewBox="0 0 170 170" fill="#fff"><path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.34.13-9.13-1.9-14.37-6.08-3.32-2.73-7.18-7.39-11.58-13.98-7.33-11.02-13.25-23.82-17.77-38.39-4.51-14.58-6.77-28.02-6.77-40.33 0-15.66 3.73-28.53 11.19-38.61 7.46-10.08 17.02-15.22 28.68-15.42 4.69 0 10.02 1.18 15.99 3.55 5.97 2.37 10.08 3.56 12.33 3.56 1.83 0 6.09-1.25 12.78-3.75 6.69-2.5 12.22-3.61 16.59-3.35 12.19.67 21.94 5.23 29.25 13.68-10.75 6.53-15.99 15.79-15.72 27.78.27 9.4 3.96 17.26 11.07 23.57 7.11 6.32 15.62 9.87 25.53 10.66-2.54 7.55-5.96 15.42-10.26 23.61zM119.22 31.54c0-7.37 2.7-14.42 8.1-21.15 5.4-6.73 12.21-10.39 20.43-10.99.13.93.2 1.73.2 2.39 0 7.37-2.73 14.54-8.19 21.51-5.46 6.97-12.33 10.74-20.61 11.31-.07-.8-.07-1.82-.07-3.07z"/></svg>
                        Continua con Apple
                    </button>
                </div>

                <div class="auth-divider">oppure usa la tua email</div>

                <div class="auth-form-group">
                    <label>Email</label>
                    <input type="email" id="auth-email" placeholder="latua@email.com">
                </div>
                <div class="auth-form-group">
                    <label>Password</label>
                    <div class="password-container">
                        <input type="password" id="auth-password" placeholder="••••••••">
                        <button class="toggle-password-btn" type="button" onclick="togglePasswordVisibility('auth-password', this)">👁️</button>
                    </div>
                    ${!isLogin ? `<span class="auth-hint">Minimo 8 caratteri ed almeno un carattere speciale (!@#$%^&*)</span>` : ''}
                </div>
            `;

            actionsBox.innerHTML = `
                <button class="btn-cancel" id="modal-btn-cancel">Annulla</button>
                <button class="btn-confirm" id="auth-submit-btn">${isLogin ? "Accedi" : "Registrati"}</button>
            `;

            modal.classList.add('active');

            document.getElementById('modal-btn-cancel').onclick = () => modal.classList.remove('active');

            document.getElementById('auth-submit-btn').onclick = () => {
                const email = document.getElementById('auth-email').value.trim();
                const password = document.getElementById('auth-password').value;
                const errorEl = document.getElementById('auth-error-msg');

                if (!email || !password) {
                    errorEl.innerText = "Compila tutti i campi.";
                    return;
                }

                if (!isLogin) {
                    const hasSpecialChar = /[!@#$%^&*(),.?":{}|<>_\-\/\\]/.test(password);
                    if (password.length < 8) {
                        errorEl.innerText = "La password deve contenere almeno 8 caratteri.";
                        return;
                    }
                    if (!hasSpecialChar) {
                        errorEl.innerText = "La password deve contenere almeno un carattere speciale.";
                        return;
                    }
                }

                const authPromise = isLogin 
                    ? auth.signInWithEmailAndPassword(email, password)
                    : auth.createUserWithEmailAndPassword(email, password);

                authPromise
                    .then(() => {
                        modal.classList.remove('active');
                    })
                    .catch((error) => {
                        errorEl.innerText = error.message;
                    });
            };
        }

        function handleCardTap(id) {
            const skillData = userState[id] || { unlocked: false, val: 0 };
            if (!skillData.unlocked) {
                askUnlock(id);
            }
        }

        function askUnlock(id) {
            const skill = findSkillById(id);
            if (!skill) return;

            openCustomModal(
                "🎉 Sblocca Skill",
                `Vuoi sbloccare <strong>"${skill.name}"</strong>?<br><br>Ottieni subito un bonus unico di <strong style="color: var(--accent);">+${skill.unlockXp} XP</strong>!`,
                "Sblocca Ora",
                false,
                () => {
                    if (!userState[id]) {
                        userState[id] = { unlocked: true, val: 0 };
                    } else {
                        userState[id].unlocked = true;
                    }
                    saveState();
                }
            );
        }

        function askRelock(id) {
            const skill = findSkillById(id);
            if (!skill) return;

            openCustomModal(
                "🔒 Riblocca Skill",
                `Vuoi bloccare di nuovo <strong>"${skill.name}"</strong>?<br><br>⚠️ La skill verrà bloccata, il punteggio azzerato e <strong>perderai tutti gli XP</strong> accumulati da essa.`,
                "Sì, Riblocca",
                true,
                () => {
                    userState[id] = { unlocked: false, val: 0 };
                    saveState();
                }
            );
        }

        function updateSkill(id) {
            const input = document.getElementById(`input-${id}`);
            if (!input) return;
            const val = parseInt(input.value) || 0;
            if (!userState[id]) {
                userState[id] = { unlocked: true, val: val };
            } else {
                userState[id].val = val;
            }
            saveState();
        }

        initCategorySelect();
        applyTheme(currentTheme);
    </script>
</body>
</html>
