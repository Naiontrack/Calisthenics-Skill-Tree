<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Occhionero's Calisthenics Tree</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            /* TEMA PREDEFINITO (Futuristic Dark) */
            --bg-color: #0b0f19;
            --card-bg: #151d30;
            --accent: #38bdf8;
            --locked: #334155;
            --unlocked: #22c55e;
            --text: #f8fafc;
            --subtext: #94a3b8;
            --line-color: #1e293b;
            --danger: #ef4444;
            --input-bg: #0b0f19;
            --img-bg: #070a12;
            --border-glow: rgba(56, 189, 248, 0.4);
        }

        /* TEMA CHIARO */
        body.theme-light {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --accent: #0284c7;
            --locked: #cbd5e1;
            --unlocked: #16a34a;
            --text: #0f172a;
            --subtext: #64748b;
            --line-color: #cbd5e1;
            --danger: #dc2626;
            --input-bg: #f8fafc;
            --img-bg: #e2e8f0;
            --border-glow: rgba(2, 132, 199, 0.25);
        }

        /* TEMA SCURO CLASSICO */
        body.theme-dark {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #bb86fc;
            --locked: #374151;
            --unlocked: #03dac6;
            --text: #e0e0e0;
            --subtext: #9ca3af;
            --line-color: #2d2d2d;
            --danger: #cf6679;
            --input-bg: #121212;
            --img-bg: #2a2a2a;
            --border-glow: rgba(187, 134, 252, 0.3);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 900px;
            position: sticky;
            top: 0;
            background: var(--bg-color);
            padding-top: 10px;
            padding-bottom: 15px;
            z-index: 10;
            transition: background-color 0.3s ease;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h1 {
            margin: 0;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.4rem;
            text-shadow: 0 0 15px var(--border-glow);
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .selector-box {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .custom-select {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--accent);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            max-width: 200px;
        }

        /* AUTH BAR STYLES */
        .auth-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 8px 15px;
            border-radius: 10px;
            border: 1px solid var(--line-color);
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .auth-bar span {
            color: var(--subtext);
        }

        .auth-bar strong {
            color: var(--accent);
        }

        .auth-actions {
            display: flex;
            gap: 8px;
        }

        .btn-auth {
            background: var(--accent);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .btn-auth-secondary {
            background: var(--locked);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .rank-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 16px;
            border: 2px solid var(--accent);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            transition: background-color 0.3s ease, border-color 0.3s ease;
            margin-bottom: 15px;
        }

        .rank-badge-box {
            width: 90px;
            height: 90px;
            margin-bottom: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 12px var(--border-glow));
        }

        .rank-badge-box svg {
            width: 100%;
            height: 100%;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: var(--locked);
            border-radius: 6px;
            overflow: hidden;
            margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--unlocked));
            transition: width 0.4s ease;
        }

        /* CLASSIFICA GLOBALE (LEADERBOARD) */
        .leaderboard-section {
            width: 100%;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            box-sizing: border-box;
            border: 1px solid var(--line-color);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            text-align: left;
            margin-bottom: 15px;
        }

        .leaderboard-title {
            color: var(--accent);
            font-size: 1.1rem;
            margin: 0 0 12px 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 6px;
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-color);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--line-color);
            cursor: pointer;
            transition: transform 0.1s, border-color 0.2s;
        }

        .leaderboard-item:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .leaderboard-item.current-user-item {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--border-glow);
        }

        .leaderboard-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .leaderboard-rank-pos {
            font-weight: bold;
            font-size: 0.9rem;
            min-width: 22px;
            color: var(--subtext);
        }

        .leaderboard-avatar {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .leaderboard-avatar svg {
            width: 100%;
            height: 100%;
        }

        .leaderboard-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .leaderboard-xp {
            font-weight: bold;
            color: var(--unlocked);
            font-size: 0.85rem;
        }

        /* SEZIONE CHAT GLOBALE */
        .chat-section {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            box-sizing: border-box;
            border: 1px solid var(--line-color);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            margin-bottom: 25px;
        }

        .chat-title {
            color: var(--accent);
            font-size: 1.1rem;
            margin: 0 0 12px 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 6px;
        }

        .chat-messages {
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 200px;
            overflow-y: auto;
            background: var(--bg-color);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--line-color);
            margin-bottom: 10px;
        }

        .chat-msg {
            font-size: 0.85rem;
            line-height: 1.3;
            background: var(--card-bg);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--line-color);
            word-break: break-word;
        }

        .chat-msg-author {
            font-weight: bold;
            color: var(--accent);
            margin-right: 5px;
        }

        .chat-msg-rank {
            font-size: 0.75rem;
            color: var(--subtext);
            margin-right: 5px;
        }

        .chat-input-box {
            display: flex;
            gap: 8px;
        }

        .chat-input-box input {
            flex-grow: 1;
            width: auto !important;
            text-align: left !important;
            padding: 8px 12px !important;
        }

        .tree-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 40px;
        }

        .category-title {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 6px;
            margin-top: 10px;
            text-transform: uppercase;
            font-size: 1.1rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .skill-tree-branch {
            display: flex;
            flex-direction: column;
            position: relative;
            padding-left: 12px;
            border-left: 2px dashed var(--line-color);
            margin-left: 8px;
            gap: 12px;
        }

        .skill-card {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid var(--locked);
            transition: all 0.3s ease;
            gap: 12px;
            position: relative;
            opacity: 0.75;
        }

        .skill-card.unlocked-card {
            border-left-color: var(--unlocked);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            opacity: 1;
        }

        .skill-card::before {
            content: '';
            position: absolute;
            left: -14px;
            top: 50%;
            width: 12px;
            height: 2px;
            background-color: var(--line-color);
        }

        .skill-content {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            cursor: pointer;
            touch-action: manipulation;
        }

        .skill-img-box {
            width: 65px;
            height: 65px;
            min-width: 65px;
            border-radius: 10px;
            border: 2px solid var(--locked);
            background: var(--img-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            transition: background-color 0.3s ease, border-color 0.3s ease;
            pointer-events: none;
        }

        .unlocked-card .skill-img-box {
            border-color: var(--accent);
        }

        .skill-img-box svg {
            width: 100%;
            height: 100%;
        }

        .skill-info {
            flex-grow: 1;
            pointer-events: none;
        }

        .skill-info h4 {
            margin: 0 0 4px 0;
            font-size: 0.95rem;
        }

        .skill-info p {
            margin: 2px 0;
            font-size: 0.8rem;
            color: var(--subtext);
        }

        .actions {
            display: flex;
            gap: 6px;
            align-items: center;
            z-index: 2;
        }

        input[type="number"], input[type="email"], input[type="password"], input[type="text"] {
            width: 55px;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid var(--locked);
            background: var(--input-bg);
            color: var(--text);
            text-align: center;
            font-size: 0.9rem;
            touch-action: manipulation;
        }

        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            transition: transform 0.1s, opacity 0.2s;
            touch-action: manipulation;
        }

        body.theme-light button {
            color: #fff;
        }

        button.unlock-btn {
            background: #eab308;
            color: #000;
        }

        button.relock-btn {
            background: var(--locked);
            color: var(--subtext);
            padding: 6px 8px;
        }

        button.relock-btn:hover {
            background: var(--danger);
            color: #fff;
        }

        button:active {
            transform: scale(0.95);
        }

        /* CUSTOM MODAL POP-UP & AUTH FORMS */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 20px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.2s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-box h3 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1.2rem;
        }

        .modal-box p {
            font-size: 0.95rem;
            color: var(--text);
            line-height: 1.4;
            margin: 15px 0 20px 0;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        .modal-actions button {
            padding: 10px 18px;
            font-size: 0.9rem;
            flex: 1;
        }

        .auth-form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
            text-align: left;
        }

        .auth-form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--subtext);
        }

        .auth-form-group input, .auth-form-group select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            text-align: left;
            border-radius: 6px;
            border: 1px solid var(--locked);
            background: var(--input-bg);
            color: var(--text);
        }

        .auth-error {
            color: var(--danger);
            font-size: 0.85rem;
            margin-bottom: 10px;
            min-height: 18px;
        }

        .btn-cancel {
            background: var(--locked);
            color: var(--text);
        }

        .btn-confirm {
            background: var(--accent);
            color: #fff;
        }

        .unlocked-skills-list {
            text-align: left;
            max-height: 250px;
            overflow-y: auto;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .unlocked-skill-item {
            background: var(--bg-color);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--line-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            .header {
                position: static;
                padding-top: 0;
                padding-bottom: 5px;
            }

            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .controls-group {
                width: 100%;
                justify-content: space-between;
            }

            .custom-select {
                max-width: 150px;
            }

            .rank-card {
                padding: 10px;
            }

            .rank-badge-box {
                width: 70px;
                height: 70px;
            }

            .skill-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .skill-card::before {
                top: 35px;
            }

            .actions {
                width: 100%;
                justify-content: flex-end;
            }

            input[type="number"] {
                width: 65px;
                padding: 8px;
            }

            button {
                padding: 8px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="auth-bar" id="auth-bar">
            <span id="user-status-text">👤 Non autenticato (Salvataggio locale)</span>
            <div class="auth-actions" id="auth-actions-container">
                <button class="btn-auth-secondary" onclick="openAuthModal('login')">Accedi</button>
                <button class="btn-auth" onclick="openAuthModal('signup')">Registrati</button>
            </div>
        </div>

        <div class="top-bar">
            <h1>Occhionero's Calisthenics Tree</h1>
            <div class="controls-group">
                <div class="selector-box">
                    <label for="categorySelect">📁 Sezione:</label>
                    <select id="categorySelect" class="custom-select" onchange="changeCategory(this.value)">
                        <option value="all">Tutte (Tutto)</option>
                    </select>
                </div>
                <div class="selector-box">
                    <label for="themeSelect">🎨 Tema:</label>
                    <select id="themeSelect" class="custom-select" onchange="changeTheme(this.value)">
                        <option value="default">Predefinito</option>
                        <option value="light">Chiaro</option>
                        <option value="dark">Scuro</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="rank-card">
            <div id="rank-icon-box" class="rank-badge-box"></div>
            <h2 id="user-rank" style="margin:0; color: var(--accent); font-size: 1.1rem;">GRADO: Unranked</h2>
            <p id="total-xp" style="margin: 4px 0 0 0; font-weight: 600; font-size: 0.9rem;">XP Totali: 0</p>
            <div class="progress-bar">
                <div class="progress-fill" id="rank-progress"></div>
            </div>
        </div>

        <div class="leaderboard-section">
            <h3 class="leaderboard-title">🏆 Classifica Globale</h3>
            <div class="leaderboard-list" id="leaderboard-container">
                <p style="color: var(--subtext); text-align: center; font-size: 0.9rem;">Caricamento classifica...</p>
            </div>
        </div>
    </div>

    <div class="chat-section" id="chat-section">
        <h3 class="chat-title">💬 Chat Globale</h3>
        <div id="chat-login-notice" style="text-align: center; color: var(--subtext); font-size: 0.9rem; padding: 10px;">
            🔒 Devi effettuare l'accesso per poter vedere e partecipare alla chat.
        </div>
        <div id="chat-content" style="display: none;">
            <div class="chat-messages" id="chat-messages">
                <p style="color: var(--subtext); text-align: center;">Caricamento messaggi...</p>
            </div>
            <div class="chat-input-box">
                <input type="text" id="chat-input" placeholder="Scrivi un messaggio..." onkeypress="if(event.key === 'Enter') sendChatMessage()">
                <button onclick="sendChatMessage()">Invia</button>
            </div>
        </div>
    </div>

    <div class="tree-container" id="tree"></div>

    <div class="modal-overlay" id="custom-modal">
        <div class="modal-box">
            <h3 id="modal-title">Titolo</h3>
            <div id="modal-body-content">
                <p id="modal-desc">Descrizione del messaggio</p>
            </div>
            <div class="modal-actions" id="modal-actions-box">
                <button class="btn-cancel" id="modal-btn-cancel">Annulla</button>
                <button class="btn-confirm" id="modal-btn-confirm">Conferma</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURAZIONE FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyA8DxxaRgjpdv9eldZnDiAipceVv6IJ5Ds",
            authDomain: "calisthenics-tree-b9a06.firebaseapp.com",
            projectId: "calisthenics-tree-b9a06",
            storageBucket: "calisthenics-tree-b9a06.firebasestorage.app",
            messagingSenderId: "385003641400",
            appId: "1:385003641400:web:7974dd3adc322170c264cd",
            measurementId: "G-ZF4P6HX9HN"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let userNickname = "";
        let userIsPrivate = false;
        let leaderboardUnsubscribe = null;
        let chatUnsubscribe = null;

        const rankLogos = {
            bronze: `<svg viewBox="0 0 100 100"><defs><linearGradient id="b" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#78350f"/></linearGradient></defs><polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="url(#b)" stroke="#f59e0b" stroke-width="3"/><path d="M50 20 L75 70 L25 70 Z" fill="#451a03" opacity="0.6"/><circle cx="50" cy="50" r="15" fill="#f59e0b"/></svg>`,
            silver: `<svg viewBox="0 0 100 100"><defs><linearGradient id="s" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#e2e8f0"/><stop offset="100%" stop-color="#475569"/></linearGradient></defs><polygon points="50,5 95,30 80,85 20,85 5,30" fill="url(#s)" stroke="#f8fafc" stroke-width="3"/><polygon points="50,20 75,50 50,80 25,50" fill="#94a3b8"/><circle cx="50" cy="50" r="12" fill="#f8fafc"/></svg>`,

            overhuman: `<svg viewBox="0 0 100 100"><defs><linearGradient id="oh" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f43f5e"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs><polygon points="50,0 95,25 95,75 50,100 5,75 5,25" fill="url(#oh)" stroke="#fff" stroke-width="4"/><circle cx="50" cy="50" r="25" fill="#0f172a" stroke="#fff" stroke-width="3"/><path d="M50 30 L60 45 L75 50 L60 60 L65 75 L50 65 L35 75 L40 60 L25 50 L40 45 Z" fill="#fff"/></svg>`,
            godlike: `<svg viewBox="0 0 100 100"><defs><radialGradient id="gdl"><stop offset="0%" stop-color="#ffffff"/><stop offset="50%" stop-color="#fef08a"/><stop offset="100%" stop-color="#ca8a04"/></radialGradient></defs><circle cx="50" cy="50" r="45" fill="url(#gdl)" stroke="#fff" stroke-width="5"/><polygon points="50,10 63,35 90,38 70,57 76,84 50,70 24,84 30,57 10,38 37,35" fill="#a16207"/></svg>`
        };

        const ranks = [
            { name: "Bronzo (Novizio)", minXp: 0, iconSvg: rankLogos.bronze },
            { name: "Argento (Atleta Base)", minXp: 1500, iconSvg: rankLogos.silver },
            { name: "Oro (Intermedio)", minXp: 4500, iconSvg: rankLogos.gold },
            { name: "Platino (Avanzato)", minXp: 11000, iconSvg: rankLogos.platinum },
            { name: "Smeraldo (Specialista)", minXp: 22000, iconSvg: rankLogos.emerald },
            { name: "Diamante (Esperto Leve)", minXp: 40000, iconSvg: rankLogos.diamond },
            { name: "Master (Maestro di Forza)", minXp: 65000, iconSvg: rankLogos.master },
            { name: "GrandMaster (Elite Atleta)", minXp: 100000, iconSvg: rankLogos.grandmaster },
            { name: "Challenger (Campione)", minXp: 150000, iconSvg: rankLogos.challenger },
            { name: "Titano (Forza Sovrumana)", minXp: 220000, iconSvg: rankLogos.titan },
            { name: "Overhuman (Leggenda Vivente)", minXp: 320000, iconSvg: rankLogos.overhuman },
            { name: "Godlike (Divinità del Calisthenics)", minXp: 450000, iconSvg: rankLogos.godlike }
        ];

        const skillStickmen = {
            planche_lean: `<svg viewBox="0 0 100 100" stroke="var(--accent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="20" cy="35" r="5" fill="var(--accent)"/><path d="M20 40 L80 62"/><path d="M45 50 L30 80"/><line x1="10" y1="80" x2="90" y2="80" stroke="var(--subtext)" stroke-width="4"/></svg>`,
            pushups_knee: `<svg viewBox="0 0 100 100" stroke="var(--accent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="20" cy="45" r="5" fill="var(--accent)"/><path d="M20 50 L60 65 L60 80"/><path d="M35 55 L35 80"/><line x1="10" y1="80" x2="90" y2="80" stroke="var(--subtext)" stroke-width="4"/></svg>`,
            pushups: `<svg viewBox="0 0 100 100" stroke="var(--accent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="20" cy="45" r="5" fill="var(--accent)"/><path d="M20 50 L85 70"/><path d="M40 55 L40 80"/><line x1="10" y1="80" x2="90" y2="80" stroke="var(--subtext)" stroke-width="4"/></svg>`,
            tuck_planche: `<svg viewBox="0 0 100 100" stroke="var(--accent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="30" cy="35" r="5" fill="var(--accent)"/><path d="M30 40 L50 42 L35 60 L50 60"/><path d="M40 41 L40 80"/><line x1="15" y1="80" x2="85" y2="80" stroke="var(--subtext)" stroke-width="4"/></svg>`,
            full_planche: `<svg viewBox="0 0 100 100" stroke="var(--accent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="15" cy="42" r="5" fill="var(--accent)"/><path d="M15 47 L88 47"/><path d="M35 47 L35 80"/><line x1="10" y1="80" x2="90" y2="80" stroke="var(--subtext)" stroke-width="4"/></svg>`,
            default_svg: `<svg viewBox="0 0 100 100" stroke="var(--accent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="50" cy="30" r="10" fill="var(--accent)"/><path d="M50 40 L50 70 M30 50 L70 50 M35 90 L50 70 L65 90"/></svg>`
        };

        const treeData = [
            {
                category: "Spinta & Planche",
                skills: [
                    { id: "pushups", name: "Piegamenti (Push-ups)", type: "reps", baseMultiplier: 10, svg: skillStickmen.pushups },
                    { id: "planche_lean", name: "Planche Lean", type: "time", baseMultiplier: 15, svg: skillStickmen.planche_lean },
                    { id: "tuck_planche", name: "Tuck Planche", type: "time", baseMultiplier: 50, svg: skillStickmen.tuck_planche },
                    { id: "full_planche", name: "Full Planche", type: "time", baseMultiplier: 250, svg: skillStickmen.full_planche }
                ]
            }
        ];

        let userState = {};

        function loadState() {
            if (!currentUser) {
                const saved = localStorage.getItem("cali_tree_userState");
                if (saved) {
                    try { userState = JSON.parse(saved); } catch (e) { userState = {}; }
                } else {
                    userState = {};
                }
                renderTree();
            } else {
                db.collection("users").doc(currentUser.uid).get().then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        userState = data.skills || {};
                        userNickname = data.nickname || "Atleta";
                        userIsPrivate = data.isPrivate || false;
                    } else {
                        userState = {};
                        userIsPrivate = false;
                    }
                    updateAuthUI();
                    renderTree();
                }).catch((err) => {
                    console.error("Errore caricamento dati:", err);
                    renderTree();
                });
            }
        }

        function saveState() {
            calculateTotalXP();
            if (!currentUser) {
                localStorage.setItem("cali_tree_userState", JSON.stringify(userState));
            } else {
                const totalXp = calculateTotalXP();
                db.collection("users").doc(currentUser.uid).set({
                    nickname: userNickname,
                    skills: userState,
                    totalXp: totalXp,
                    isPrivate: userIsPrivate,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
            }
        }

        function calculateTotalXP() {
            let total = 0;
            treeData.forEach(cat => {
                cat.skills.forEach(skill => {
                    const st = userState[skill.id];
                    if (st && st.unlocked) {
                        const val = parseInt(st.val) || 0;
                        total += val * skill.baseMultiplier;
                    }
                });
            });
            updateRankDisplay(total);
            return total;
        }

        function updateRankDisplay(xp) {
            let currentRank = ranks[0];
            let nextRank = ranks[1];

            for (let i = 0; i < ranks.length; i++) {
                if (xp >= ranks[i].minXp) {
                    currentRank = ranks[i];
                    nextRank = ranks[i + 1] || null;
                }
            }

            document.getElementById("user-rank").innerText = `GRADO: ${currentRank.name}`;
            document.getElementById("total-xp").innerText = `XP Totali: ${xp}`;
            document.getElementById("rank-icon-box").innerHTML = currentRank.iconSvg;

            const fill = document.getElementById("rank-progress");
            if (!nextRank) {
                fill.style.width = "100%";
            } else {
                const range = nextRank.minXp - currentRank.minXp;
                const progress = xp - currentRank.minXp;
                const pct = Math.min(100, Math.max(0, (progress / range) * 100));
                fill.style.width = `${pct}%`;
            }
        }

        function renderTree() {
            const container = document.getElementById("tree");
            const filterCat = document.getElementById("categorySelect").value;
            container.innerHTML = "";

            treeData.forEach(cat => {
                if (filterCat !== "all" && cat.category !== filterCat) return;

                const catHeader = document.createElement("div");
                catHeader.className = "category-title";
                catHeader.innerText = cat.category;
                container.appendChild(catHeader);

                const branch = document.createElement("div");
                branch.className = "skill-tree-branch";

                cat.skills.forEach(skill => {
                    const st = userState[skill.id] || { unlocked: false, val: 0 };
                    const card = document.createElement("div");
                    card.className = `skill-card ${st.unlocked ? 'unlocked-card' : ''}`;

                    const unitLabel = skill.type === 'reps' ? 'Ripetizioni' : 'Secondi';
                    const xpGained = st.unlocked ? (st.val * skill.baseMultiplier) : 0;

                    card.innerHTML = `
                        <div class="skill-content" onclick="${!st.unlocked ? `askUnlock('${skill.id}')` : ''}">
                            <div class="skill-img-box">${skill.svg || skillStickmen.default_svg}</div>
                            <div class="skill-info">
                                <h4>${skill.name}</h4>
                                <p>${st.unlocked ? `Sbloccata - ${xpGained} XP` : '🔒 Bloccata'}</p>
                            </div>
                        </div>
                        <div class="actions">
                            ${st.unlocked ? `
                                <input type="number" id="input-${skill.id}" value="${st.val}" min="0" onchange="updateSkill('${skill.id}')" onkeyup="updateSkill('${skill.id}')">
                                <span style="font-size:0.8rem; color:var(--subtext);">${unitLabel.substr(0, 3)}</span>
                                <button class="relock-btn" onclick="askRelock('${skill.id}')" title="Riblocca">🔒</button>
                            ` : `
                                <button class="unlock-btn" onclick="askUnlock('${skill.id}')">Sblocca</button>
                            `}
                        </div>
                    `;
                    branch.appendChild(card);
                });

                container.appendChild(branch);
            });

            calculateTotalXP();
        }

        function findSkillById(id) {
            for (let c of treeData) {
                for (let s of c.skills) {
                    if (s.id === id) return s;
                }
            }
            return null;
        }

        function askUnlock(id) {
            const skill = findSkillById(id);
            if (!skill) return;

            openCustomModal(
                "🔓 Sblocca Skill",
                `Vuoi sbloccare <strong>"${skill.name}"</strong>?`,
                "Sblocca Ora",
                false,
                () => {
                    if (!userState[id]) userState[id] = { unlocked: true, val: 0 };
                    else userState[id].unlocked = true;
                    saveState();
                    renderTree();
                }
            );
        }

        function askRelock(id) {
            const skill = findSkillById(id);
            if (!skill) return;

            openCustomModal(
                "🔒 Riblocca Skill",
                `Vuoi bloccare di nuovo <strong>"${skill.name}"</strong>? I progressi per questa skill verranno azzerati.`,
                "Sì, Riblocca",
                true,
                () => {
                    userState[id] = { unlocked: false, val: 0 };
                    saveState();
                    renderTree();
                }
            );
        }

        function updateSkill(id) {
            const input = document.getElementById(`input-${id}`);
            if (!input) return;
            const val = parseInt(input.value) || 0;
            if (!userState[id]) userState[id] = { unlocked: true, val: val };
            else userState[id].val = val;
            saveState();
        }

        function initCategorySelect() {
            const select = document.getElementById("categorySelect");
            select.innerHTML = `<option value="all">Tutte (Tutto)</option>`;
            treeData.forEach(cat => {
                const opt = document.createElement("option");
                opt.value = cat.category;
                opt.innerText = cat.category;
                select.appendChild(opt);
            });
        }

        function changeCategory() { renderTree(); }
        function changeTheme(theme) {
            document.body.className = theme === 'default' ? '' : `theme-${theme}`;
        }

        // ==========================================
        // CLASSIFICA E POPUP UTENTE
        // ==========================================
        function initLeaderboardListener() {
            if (leaderboardUnsubscribe) leaderboardUnsubscribe();

            leaderboardUnsubscribe = db.collection("users")
                .orderBy("totalXp", "desc")
                .limit(20)
                .onSnapshot((snapshot) => {
                    const container = document.getElementById("leaderboard-container");
                    if (snapshot.empty) {
                        container.innerHTML = `<p style="color: var(--subtext); text-align: center; font-size: 0.9rem;">Nessun utente in classifica.</p>`;
                        return;
                    }

                    let html = "";
                    let pos = 1;

                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        const isMe = currentUser && doc.id === currentUser.uid;
                        const name = data.nickname || "Atleta Anonimo";
                        const xp = data.totalXp || 0;
                        const isPriv = data.isPrivate || false;

                        html += `
                            <div class="leaderboard-item ${isMe ? 'current-user-item' : ''}" onclick="viewUserProfile('${doc.id}')">
                                <div class="leaderboard-left">
                                    <span class="leaderboard-rank-pos">#${pos}</span>
                                    <span class="leaderboard-name">${name} ${isPriv ? '🔒' : ''} ${isMe ? ' (Tu)' : ''}</span>
                                </div>
                                <span class="leaderboard-xp">${xp} XP</span>
                            </div>
                        `;
                        pos++;
                    });

                    container.innerHTML = html;
                }, (err) => {
                    console.error("Errore classifica:", err);
                });
        }

        function viewUserProfile(userId) {
            db.collection("users").doc(userId).get().then((doc) => {
                if (!doc.exists) return;
                const data = doc.data();
                const isMe = currentUser && currentUser.uid === userId;
                const name = data.nickname || "Atleta";

                if (data.isPrivate && !isMe) {
                    openCustomModal(
                        `🔒 Profilo Privato`,
                        `<p><strong>${name}</strong> ha impostato il proprio profilo su <strong>Privato</strong>.</p><p style="color:var(--subtext); font-size:0.85rem;">Non è possibile visualizzare le skill sbloccate da questo utente.</p>`,
                        "Chiudi",
                        false,
                        null
                    );
                    return;
                }

                const skills = data.skills || {};
                let unlockedHtml = "<div class='unlocked-skills-list'>";
                let count = 0;

                treeData.forEach(cat => {
                    cat.skills.forEach(sk => {
                        if (skills[sk.id] && skills[sk.id].unlocked) {
                            count++;
                            const val = skills[sk.id].val || 0;
                            const xp = val * sk.baseMultiplier;
                            const unit = sk.type === 'reps' ? 'rep' : 'sec';
                            unlockedHtml += `
                                <div class="unlocked-skill-item">
                                    <span><strong>${sk.name}</strong> (${val} ${unit})</span>
                                    <span style="color:var(--unlocked); font-weight:bold;">+${xp} XP</span>
                                </div>
                            `;
                        }
                    });
                });

                unlockedHtml += "</div>";

                if (count === 0) {
                    unlockedHtml = `<p style="color:var(--subtext);">Questo utente non ha ancora sbloccato nessuna skill.</p>`;
                }

                openCustomModal(
                    `🏆 Profilo: ${name}`,
                    `<p><strong>XP Totali:</strong> ${data.totalXp || 0}</p>
                     <p><strong>Skill Sbloccate:</strong></p>
                     ${unlockedHtml}`,
                    "Chiudi",
                    false,
                    null
                );
            });
        }

        // ==========================================
        // CHAT GLOBALE
        // ==========================================
        function initChatListener() {
            if (chatUnsubscribe) chatUnsubscribe();

            chatUnsubscribe = db.collection("chat")
                .orderBy("timestamp", "desc")
                .limit(50)
                .onSnapshot((snapshot) => {
                    const container = document.getElementById("chat-messages");
                    if (snapshot.empty) {
                        container.innerHTML = `<p style="color: var(--subtext); text-align: center;">Nessun messaggio presente.</p>`;
                        return;
                    }

                    let msgs = [];
                    snapshot.forEach(doc => msgs.push(doc.data()));
                    msgs.reverse();

                    let html = "";
                    msgs.forEach(m => {
                        html += `
                            <div class="chat-msg">
                                <span class="chat-msg-author">${m.author}:</span>
                                <span>${escapeHtml(m.text)}</span>
                            </div>
                        `;
                    });

                    container.innerHTML = html;
                    container.scrollTop = container.scrollHeight;
                });
        }

        function sendChatMessage() {
            if (!currentUser) return;
            const input = document.getElementById("chat-input");
            const text = input.value.trim();
            if (!text) return;

            db.collection("chat").add({
                uid: currentUser.uid,
                author: userNickname || "Atleta",
                text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                input.value = "";
            }).catch(err => {
                console.error("Errore invio messaggio:", err);
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // ==========================================
        // GESTIONE AUTENTICAZIONE E MODALE
        // ==========================================
        function openAuthModal(mode) {
            const title = mode === 'login' ? "Accedi" : "Registrati";
            const isLogin = mode === 'login';

            let bodyHtml = `
                <div class="auth-form-group">
                    <label>Email</label>
                    <input type="email" id="auth-email" placeholder="latua@email.com">
                </div>
                <div class="auth-form-group">
                    <label>Password</label>
                    <input type="password" id="auth-password" placeholder="••••••••">
                </div>
            `;

            if (!isLogin) {
                bodyHtml += `
                    <div class="auth-form-group">
                        <label>Nickname</label>
                        <input type="text" id="auth-nickname" placeholder="Il tuo nome atleta">
                    </div>
                    <div class="auth-form-group">
                        <label>Privacy Profilo</label>
                        <select id="auth-privacy">
                            <option value="public">Pubblico (Visibile in classifica)</option>
                            <option value="private">Privato (Nascosto agli altri)</option>
                        </select>
                    </div>
                `;
            }

            bodyHtml += `<div class="auth-error" id="auth-error-msg"></div>`;

            openCustomModal(
                title,
                bodyHtml,
                title,
                false,
                () => {
                    const email = document.getElementById("auth-email").value;
                    const password = document.getElementById("auth-password").value;
                    const errBox = document.getElementById("auth-error-msg");

                    if (isLogin) {
                        auth.signInWithEmailAndPassword(email, password).then(() => {
                            closeCustomModal();
                        }).catch(err => {
                            errBox.innerText = err.message;
                        });
                    } else {
                        const nick = document.getElementById("auth-nickname").value.trim() || "Atleta";
                        const isPriv = document.getElementById("auth-privacy").value === 'private';

                        auth.createUserWithEmailAndPassword(email, password).then((cred) => {
                            userNickname = nick;
                            userIsPrivate = isPriv;
                            return db.collection("users").doc(cred.user.uid).set({
                                nickname: nick,
                                isPrivate: isPriv,
                                totalXp: calculateTotalXP(),
                                skills: userState
                            });
                        }).then(() => {
                            closeCustomModal();
                        }).catch(err => {
                            errBox.innerText = err.message;
                        });
                    }
                }
            );
        }

        function openSettingsModal() {
            let bodyHtml = `
                <div class="auth-form-group">
                    <label>Nickname</label>
                    <input type="text" id="edit-nickname" value="${userNickname}">
                </div>
                <div class="auth-form-group">
                    <label>Privacy Profilo</label>
                    <select id="edit-privacy">
                        <option value="public" ${!userIsPrivate ? 'selected' : ''}>Pubblico</option>
                        <option value="private" ${userIsPrivate ? 'selected' : ''}>Privato</option>
                    </select>
                </div>
            `;

            openCustomModal(
                "⚙️ Impostazioni Account",
                bodyHtml,
                "Salva Modifiche",
                false,
                () => {
                    const newNick = document.getElementById("edit-nickname").value.trim() || "Atleta";
                    const newPriv = document.getElementById("edit-privacy").value === 'private';

                    userNickname = newNick;
                    userIsPrivate = newPriv;
                    saveState();
                    updateAuthUI();
                    closeCustomModal();
                }
            );
        }

        function updateAuthUI() {
            const statusText = document.getElementById("user-status-text");
            const actionsBox = document.getElementById("auth-actions-container");
            const chatNotice = document.getElementById("chat-login-notice");
            const chatContent = document.getElementById("chat-content");

            if (currentUser) {
                statusText.innerHTML = `👤 Loggato come <strong>${userNickname}</strong> (${userIsPrivate ? '🔒 Privato' : '🌐 Pubblico'})`;
                actionsBox.innerHTML = `
                    <button class="btn-auth-secondary" onclick="openSettingsModal()">⚙️ Opzioni</button>
                    <button class="btn-auth-secondary" onclick="auth.signOut()">Esci</button>
                `;
                chatNotice.style.display = "none";
                chatContent.style.display = "block";
                initChatListener();
            } else {
                statusText.innerText = "👤 Non autenticato (Salvataggio locale)";
                actionsBox.innerHTML = `
                    <button class="btn-auth-secondary" onclick="openAuthModal('login')">Accedi</button>
                    <button class="btn-auth" onclick="openAuthModal('signup')">Registrati</button>
                `;
                chatNotice.style.display = "block";
                chatContent.style.display = "none";
                if (chatUnsubscribe) chatUnsubscribe();
            }
        }

        function openCustomModal(title, bodyHtml, confirmText, isDanger, onConfirm) {
            document.getElementById("modal-title").innerText = title;
            document.getElementById("modal-body-content").innerHTML = bodyHtml;

            const confirmBtn = document.getElementById("modal-btn-confirm");
            confirmBtn.innerText = confirmText;
            confirmBtn.className = isDanger ? "btn-danger-confirm" : "btn-confirm";

            confirmBtn.onclick = () => {
                if (onConfirm) onConfirm();
                else closeCustomModal();
            };

            document.getElementById("modal-btn-cancel").onclick = closeCustomModal;
            document.getElementById("custom-modal").classList.add("active");
        }

        function closeCustomModal() {
            document.getElementById("custom-modal").classList.remove("active");
        }

        auth.onAuthStateChanged((user) => {
            currentUser = user;
            if (user) {
                loadState();
            } else {
                userNickname = "";
                userIsPrivate = false;
                userState = {};
                loadState();
                updateAuthUI();
            }
        });

        window.onload = () => {
            initCategorySelect();
            initLeaderboardListener();
        };
    </script>
</body>
</html>
